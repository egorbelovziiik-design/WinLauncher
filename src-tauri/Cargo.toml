[package]
name = "winlauncher"
version = "1.0.0"
default-run = "winlauncher"
description = "WinLauncher — Minecraft Java Edition launcher"
authors = ["WinLauncher contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[features]
native-smoke = []

[[bin]]
name = "native-smoke"
path = "src/bin/native-smoke.rs"
required-features = ["native-smoke"]

[lib]
name = "winlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = "0.33"
fs2 = "0.4"
open = "5"
url = "2"
base64 = "0.22"
quick-xml = "0.37"
regex = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
