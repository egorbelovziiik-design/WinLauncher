name: Build Nexus Client Omega X mods

on:
  workflow_dispatch:
  push:
    branches: [ 'arena/993b5c08-winlauncher' ]
    paths:
      - 'NexusOmegaX/**'
      - '.github/workflows/build-mods.yml'

jobs:
  build:
    name: Build ${{ matrix.jar }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: nexus1165
            java: 17
            gradle: 8.10.2
            loom: 1.6-SNAPSHOT
            jar: NexusOmegaX-1.16.5.jar
          - dir: nexus1214
            java: 21
            gradle: 9.5.0
            loom: 1.17.21
            jar: NexusOmegaX-1.21.4.jar
          - dir: nexus12111
            java: 21
            gradle: 9.5.0
            loom: 1.17.21
            jar: NexusOmegaX-1.21.11.jar
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build ${{ matrix.dir }}
        working-directory: NexusOmegaX/adapters/${{ matrix.dir }}
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          gradle build --no-daemon --console=plain -PloomVersion=${{ matrix.loom }} 2>&1 \
            | tee "$GITHUB_WORKSPACE/ci-logs/${{ matrix.dir }}-full.log"

      - name: Publish the build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Gradle log: ${{ matrix.dir }}  ($(date -u))"
            echo '```'
            grep -A5 "error:" "$GITHUB_WORKSPACE/ci-logs/${{ matrix.dir }}-full.log" | head -600
            echo '```'
            echo
            echo "### tail"
            echo '```'
            grep -vE "^\\s+at |^$" "$GITHUB_WORKSPACE/ci-logs/${{ matrix.dir }}-full.log" | tail -60
            echo '```'
          } > /tmp/report.md
          base64 -w0 /tmp/report.md > /tmp/report.b64
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-logs/${{ matrix.dir }}.md" \
            -f message="ci: build log for ${{ matrix.dir }}" \
            -f content="$(cat /tmp/report.b64)" \
            -f branch="$GITHUB_REF_NAME" \
            -f sha="$(gh api "repos/${{ github.repository }}/contents/ci-logs/${{ matrix.dir }}.md?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || echo '')" \
          || gh api --method PUT "repos/${{ github.repository }}/contents/ci-logs/${{ matrix.dir }}.md" \
            -f message="ci: build log for ${{ matrix.dir }}" \
            -f content="$(cat /tmp/report.b64)" \
            -f branch="$GITHUB_REF_NAME" || true

      - name: Collect the jar
        run: |
          mkdir -p artifacts
          find "NexusOmegaX/adapters/${{ matrix.dir }}/build/libs" -name "${{ matrix.jar }}" -exec cp -v {} artifacts/ \;
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jar }}
          path: artifacts/*.jar
          if-no-files-found: error

  publish:
    name: Publish rolling release
    if: always()
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package the mods zip
        run: |
          ls -la artifacts || true
          mkdir -p mods
          cp artifacts/*.jar mods/ 2>/dev/null || true
          ls -la mods
          if [ -z "$(ls -A mods)" ]; then echo "no jars were built"; exit 1; fi
          cat > mods/READ-ME.txt <<'TXT'
          NEXUS CLIENT OMEGA X - Fabric mods
          =================================

          NexusOmegaX-1.16.5.jar   - Minecraft 1.16.5  (needs Fabric Loader 0.14+)
          NexusOmegaX-1.21.4.jar   - Minecraft 1.21.4  (needs Fabric Loader 0.16+)
          NexusOmegaX-1.21.11.jar  - Minecraft 1.21.11 (needs Fabric Loader 0.17+)

          Install
          -------
          1. Install Fabric for the version you play:
             https://fabricmc.net/use/installer/
          2. Put the matching jar into %APPDATA%\.minecraft\mods\
             (Linux/macOS: ~/.minecraft/mods/)
          3. Start the "fabric-loader" profile in the official launcher.
          4. The Nexus menu opens on the title screen; in game F6 opens it,
             type .help in the chat for the command list.

          Only one jar per Minecraft version is needed - do not put all
          three into the same mods folder.
          TXT
          cd mods && zip -r ../NexusOmegaX-mods.zip . && cd ..
          ls -la NexusOmegaX-mods.zip

      - name: Verify the jars
        run: |
          set -e
          COUNT=$(ls artifacts/*.jar 2>/dev/null | wc -l)
          echo "built jars: $COUNT"
          for J in artifacts/*.jar; do
            echo "== $J"
            unzip -l "$J" | tail -3
            unzip -p "$J" fabric.mod.json > /tmp/mod.json || { echo "no fabric.mod.json in $J"; exit 1; }
            grep -E '"id"|"version"|"entrypoints"' /tmp/mod.json | head -5
            unzip -l "$J" | grep -qE "nexus/(adapter|core)/.*\.class" || { echo "no nexus classes in $J"; exit 1; }
            unzip -l "$J" | grep -q "mixins.json\|nexusomegax" || echo "warning: no mixin config in $J"
          done
          unzip -l NexusOmegaX-mods.zip
          test "$(unzip -l NexusOmegaX-mods.zip | grep -c '\.jar')" -ge 1
          echo "jar verification passed"

      - name: Checksums
        run: |
          cd artifacts && sha256sum *.jar > SHA256SUMS.txt && cd ..
          cp artifacts/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Guard - mixin configs point at real classes
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys
          bad = []
          for cfg in glob.glob('NexusOmegaX/adapters/*/src/main/resources/*.mixins.json'):
              data = json.load(open(cfg))
              srcroot = os.path.dirname(os.path.dirname(os.path.dirname(cfg)))
              for key in ('client', 'mixins', 'server'):
                  for cls in data.get(key, []):
                      path = os.path.join(srcroot, data['package'].replace('.', '/'), cls + '.java')
                      if not os.path.isfile(path):
                          bad.append((cfg, cls, path))
          if bad:
              for cfg, cls, path in bad:
                  print('MISSING: %s -> %s (%s)' % (cfg, cls, path))
              sys.exit(1)
          print('ok - every mixin listed in a config exists')
          EOF

      - name: Guard - no mixin package references from outside
        run: |
          set -e
          FAIL=0
          # Mixin throws IllegalClassLoadError at startup when a normal class
          # references anything inside a configured mixin package.
          for SRC in NexusOmegaX/adapters/*/src/nexus/adapter/*; do
            PKG=$(basename "$SRC")
            if grep -rn "nexus\.adapter\.$PKG\.mixin\." --include=*.java "$SRC" \
                 | grep -v "/mixin/" | grep -q .; then
              echo "ILLEGAL: a class outside the mixin package references nexus.adapter.$PKG.mixin.*"
              grep -rn "nexus\.adapter\.$PKG\.mixin\." --include=*.java "$SRC" | grep -v "/mixin/" || true
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "ok - no illegal mixin references"

      - name: Guard - no mixin package strings inside the built jars
        run: |
          set -e
          for J in artifacts/*.jar; do
            rm -rf /tmp/jarcheck && mkdir -p /tmp/jarcheck
            unzip -q "$J" -d /tmp/jarcheck
            HITS=$(grep -rlaE "adapter/v[0-9]+/mixin/" /tmp/jarcheck/nexus/adapter --include=*.class 2>/dev/null \
                    | grep -v "/mixin/" || true)
            if [ -n "$HITS" ]; then
              echo "ILLEGAL mixin package reference inside $J:"
              echo "$HITS"
              exit 1
            fi
            echo "ok - $J"
          done

      - name: Publish jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts
          SUMS=$(cat SHA256SUMS.txt)
          gh release delete nexus-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create nexus-latest \
            --title "NEXUS CLIENT OMEGA X (Fabric mods)" \
            --notes "Автосборка Fabric-модов NEXUS CLIENT OMEGA X из ветки ${GITHUB_REF_NAME}.

          - NexusOmegaX-1.16.5.jar  - Minecraft 1.16.5 (protocol 754, Java 8)
          - NexusOmegaX-1.21.4.jar  - Minecraft 1.21.4 (protocol 769, Java 21)
          - NexusOmegaX-1.21.11.jar - Minecraft 1.21.11 (protocol 774, Java 21)
          - NexusInjector.exe       - лаунчер/установщик под Windows
          - NexusOmegaX-mods.zip    - все три jar одним архивом (проще всего)
          - NexusOmegaX-Source.zip  - исходники
          - SHA256SUMS.txt          - контрольные суммы

          sha256:
          ${SUMS}

          Установка: установите Fabric официальным установщиком (fabricmc.net/use/installer)
          для нужной версии, положите jar в %APPDATA%\\.minecraft\\mods, выберите профиль
          \"Nexus Client Omega X\" в лаунчере, Play. В игре: F6 - меню Nexus (ник, быстрые действия), RIGHT SHIFT - ClickGUI, .help - команды." \
            artifacts/*.jar \
            SHA256SUMS.txt \
            NexusOmegaX-mods.zip \
            NexusOmegaX/dist/NexusInjector.exe \
            NexusOmegaX/NexusOmegaX-Source.zip
