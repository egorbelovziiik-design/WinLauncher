name: Build MADorigg .exe

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
    paths:
      - "MADorigg/**"
      - ".github/workflows/build-madorigg.yml"

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\cache
          key: ${{ runner.os }}-pip-madorigg-${{ hashFiles('MADorigg/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-madorigg-

      - name: Install dependencies
        working-directory: MADorigg
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        working-directory: MADorigg
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name MADorigg
          --collect-all pycaw
          --collect-all comtypes
          --collect-all numpy
          --collect-all pygame
          --hidden-import pycaw
          --hidden-import comtypes
          main.py

      - name: Smoke-test metadata
        working-directory: MADorigg
        shell: pwsh
        run: |
          $f = Get-Item dist/MADorigg.exe
          Write-Host "Built: $($f.FullName) — $([math]::Round($f.Length/1MB,1)) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MADorigg-exe
          path: MADorigg/dist/MADorigg.exe
          if-no-files-found: error
          retention-days: 30
