name: Pages (site)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/themes/**"
      - "src/assets/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - "tsconfig.json"
      - "site/tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run site:build
        env:
          GITHUB_PAGES: "true"
      - run: |
          touch site/dist/.nojekyll
          cp site/dist/index.html site/dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "site: deploy ${{ github.sha }} to Pages"
