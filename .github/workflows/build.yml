name: Build WinLaucher for Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: winlaucher-v1

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build frontend
        run: npm run build

      - name: Backend check (fast failure with readable errors)
        shell: pwsh
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --message-format short 2>&1 | Tee-Object -FilePath cargo-check.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: cargo-check.log
          if-no-files-found: ignore

      - name: Backend unit tests (launch logic)
        shell: pwsh
        run: |
          cargo test --release --manifest-path src-tauri/Cargo.toml --lib -- --test-threads=1 2>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installers
        shell: pwsh
        run: |
          npm run tauri build -- --verbose 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: ignore

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/release/winlaucher.exe out/WinLaucher-portable.exe -ErrorAction SilentlyContinue
          Get-ChildItem out | Format-Table Name, Length

      - name: Publish diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $out = @()
          if (Test-Path cargo-check.log) { $out += "===== cargo check ====="; $out += (Get-Content cargo-check.log -Tail 500) }
          if (Test-Path cargo-test.log) { $out += "===== cargo test ====="; $out += (Get-Content cargo-test.log -Tail 500) }
          if (Test-Path tauri-build.log) { $out += "===== tauri build ====="; $out += (Get-Content tauri-build.log -Tail 500) }
          if ($out.Count -eq 0) { $out = @("no log captured") }
          $out | Set-Content -Path build-errors.txt -Encoding utf8
          git config user.name "winlaucher-ci"
          git config user.email "ci@winlaucher.local"
          git add build-errors.txt
          git commit -m "ci: build diagnostics [skip ci]" || exit 0
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Verify and smoke-test artifacts
        shell: pwsh
        continue-on-error: true
        run: |
          $report = @()
          $report += "# WinLaucher build verification"
          $report += ""
          $report += "Commit: $env:GITHUB_SHA"
          $report += ""
          $report += "## Files"
          Get-ChildItem out | ForEach-Object { $report += ("- {0} — {1} bytes" -f $_.Name, $_.Length) }
          $report += ""
          $report += "## SHA-256"
          Get-FileHash out/* -Algorithm SHA256 | ForEach-Object { $report += ("- {0}: {1}" -f (Split-Path $_.Path -Leaf), $_.Hash) }
          $report += ""
          $report += "## PE metadata"
          Get-ChildItem out/*.exe | ForEach-Object {
            $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName)
            $report += ("- {0}: ProductName='{1}' FileVersion='{2}' Company='{3}' Description='{4}'" -f $_.Name, $vi.ProductName, $vi.FileVersion, $vi.CompanyName, $vi.FileDescription)
          }
          $report += ""
          $report += "## Runtime smoke test (portable exe)"
          try {
            $p = Start-Process -FilePath "out/WinLaucher-portable.exe" -PassThru
            Start-Sleep -Seconds 15
            if ($p.HasExited) {
              $report += "- FAILED: process exited after $([int]($p.ExitTime - $p.StartTime).TotalSeconds)s with code $($p.ExitCode)"
            } else {
              $report += "- OK: process stayed alive for 15s (pid $($p.Id))"
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
          } catch {
            $report += "- ERROR: $($_.Exception.Message)"
          }
          $report += ""
          $report | Set-Content -Path smoke.txt -Encoding utf8
          $report | ForEach-Object { Write-Host $_ }
          git config user.name "winlaucher-ci"
          git config user.email "ci@winlaucher.local"
          git add smoke.txt
          git commit -m "ci: smoke report [skip ci]" || exit 0
          git pull --rebase --autostash origin "$env:GITHUB_REF_NAME"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: End-to-end launch test (real Minecraft)
        if: contains(github.event.head_commit.message, '[e2e]') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        continue-on-error: true
        run: |
          # The previous report is committed, so it must be removed first,
          # otherwise the wait below returns the stale file immediately.
          Remove-Item selftest-report.txt -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "out/WinLaucher-portable.exe" -ArgumentList "--selftest","1.21.4" -PassThru
          $proc | Wait-Process -Timeout 900 -ErrorAction SilentlyContinue
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if (-not (Test-Path selftest-report.txt)) {
            Set-Content -Path selftest-report.txt -Value 'The self-test produced no report.'
          }
          Get-Content selftest-report.txt -TotalCount 220 | ForEach-Object { Write-Host $_ }
          git config user.name "winlaucher-ci"
          git config user.email "ci@winlaucher.local"
          git add selftest-report.txt
          git commit -m "ci: e2e report [skip ci]" || exit 0
          git pull --rebase --autostash origin "$env:GITHUB_REF_NAME"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: WinLaucher-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release with installers
    if: github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: WinLaucher-windows-x64
          path: out

      - name: Show files
        run: ls -lh out

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: WinLaucher 1.0.5
          make_latest: true
          draft: false
          body: |
            ## WinLaucher 1.0.5 (Windows 10/11, x64)

            Установщики собраны автоматически из ветки `arena/aea774bf-winlauncher`.

            * `WinLaucher_1.0.5_x64-setup.exe` — установщик NSIS (для текущего пользователя, без прав администратора)
            * `WinLaucher_1.0.5_x64_en-US.msi` — установщик MSI (Windows Installer)
            * `WinLaucher-portable.exe` — portable-версия, запускается без установки

            ### Важно
            * Для запуска нужна Java. Лаунчер сам скачивает нужную версию (8/16/17/21) через Adoptium.
            * Аккаунт Microsoft — вход по коду устройства через официальный OAuth Microsoft, пароль в лаунчер не вводится.
            * CurseForge работает только с вашим личным API-ключом (в настройках). Без ключа раздел недоступен — это осознанное ограничение, ключи не встраиваются в клиент.
            * Сборка не подписана сертификатом: Windows SmartScreen может показать предупреждение «Неизвестный издатель» — нажмите «Подробнее» → «Выполнить в любом случае».
          files: out/*

  release:
    name: Attach installers to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: WinLaucher-windows-x64
          path: out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: false
          generate_release_notes: true
