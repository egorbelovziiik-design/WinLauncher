name: FunTime Auction Helper - Build & Verify

on:
  push:
    branches:
      - "arena/9916b374-winlauncher"
    paths:
      - "FunTimeAuctionHelper/**"
      - ".github/workflows/funtime-auctionhelper-build.yml"
  pull_request:
    paths:
      - "FunTimeAuctionHelper/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: write

concurrency:
  group: funtime-auction-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Core unit tests + 3 Fabric JARs (1.16.5 / 1.21.4 / 1.21.11)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 8, 21 and 25 (Loom 1.19 requires a JDK 25 runtime)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            21
            25

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: 1. Core (version independent) JUnit 5 suite
        working-directory: FunTimeAuctionHelper/client-common
        run: |
          set +e
          gradle test --no-daemon -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_21_X64},${JAVA_HOME_25_X64}" > /tmp/core.log 2>&1
          code=$?
          grep -E "^[^ ]*error:|error: " /tmp/core.log | head -n 10 | sed 's/^/::error title=core-compile::/'
          # Surface the real assertion messages of failing tests in the diagnostics check run.
          if [ -d build/test-results/test ]; then
            grep -h -A3 "<failure" build/test-results/test/*.xml 2>/dev/null | head -n 80 >> /tmp/core.log || true
            grep -h -o "tests=\"[0-9]*\" skipped=\"[0-9]*\" failures=\"[0-9]*\" errors=\"[0-9]*\"" build/test-results/test/*.xml 2>/dev/null | tail -n 3 >> /tmp/core.log || true
          fi
          if [ $code -ne 0 ]; then
            echo "core" > /tmp/failed.core
            echo "::error title=core tests failed::$(tail -n 30 /tmp/core.log | tr '\n' ' ' | sed 's/%/%25/g')"
          else
            grep -E "tests completed|BUILD SUCCESSFUL" /tmp/core.log | tail -n 2
            summary=$(grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' build/test-results/test/*.xml | head -n 1)
            echo "::notice title=Core JUnit 5 suite::PASSED ${summary}"
          fi

      - name: 2. Build FunTimeAuctionHelper-1.16.5.jar
        working-directory: FunTimeAuctionHelper/client-1.16.5
        run: |
          set +e
          gradle remapJar --no-daemon -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_21_X64},${JAVA_HOME_25_X64}" > /tmp/v1165.log 2>&1
          code=$?
          grep -E "error: " /tmp/v1165.log | head -n 10 | sed 's/^/::error title=build-1.16.5::/'
          if [ $code -ne 0 ]; then
            echo "1.16.5" > /tmp/failed.1.16.5
            echo "::error title=build 1.16.5 failed::$(tail -n 40 /tmp/v1165.log | tr '\n' ' ' | sed 's/%/%25/g')"
          else
            ls -l build/libs
          fi
      - name: 3. Build FunTimeAuctionHelper-1.21.4.jar
        working-directory: FunTimeAuctionHelper/client-1.21.4
        run: |
          set +e
          gradle remapJar --no-daemon -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_21_X64},${JAVA_HOME_25_X64}" > /tmp/v1214.log 2>&1
          code=$?
          grep -E "error: " /tmp/v1214.log | head -n 10 | sed 's/^/::error title=build-1.21.4::/'
          if [ $code -ne 0 ]; then
            echo "1.21.4" > /tmp/failed.1.21.4
            echo "::error title=build 1.21.4 failed::$(tail -n 40 /tmp/v1214.log | tr '\n' ' ' | sed 's/%/%25/g')"
          else
            ls -l build/libs
          fi
      - name: 4. Build FunTimeAuctionHelper-1.21.11.jar
        working-directory: FunTimeAuctionHelper/client-1.21.11
        run: |
          set +e
          gradle remapJar --no-daemon -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_21_X64},${JAVA_HOME_25_X64}" > /tmp/v12111.log 2>&1
          code=$?
          grep -E "error: " /tmp/v12111.log | head -n 10 | sed 's/^/::error title=build-1.21.11::/'
          if [ $code -ne 0 ]; then
            echo "1.21.11" > /tmp/failed.1.21.11
            echo "::error title=build 1.21.11 failed::$(tail -n 40 /tmp/v12111.log | tr '\n' ' ' | sed 's/%/%25/g')"
          else
            ls -l build/libs
          fi
      - name: 4b. Fail if any build stage failed
        run: |
          status=0
          for f in /tmp/failed.*; do
            [ -e "$f" ] || continue
            echo "::error title=failed stage::$(cat "$f")"
            status=1
          done
          exit $status

      - name: 5. Inspect the produced JARs
        run: |
          set -euo pipefail
          set -x
          trap 'code=$?; echo "::error title=jar inspection failed::line $LINENO exited with $code"' ERR
          mkdir -p staged
          for v in 1.16.5 1.21.4 1.21.11; do
            jar="FunTimeAuctionHelper/client-$v/build/libs/FunTimeAuctionHelper-$v.jar"
            test -f "$jar" || { echo "::error title=missing jar::$jar"; exit 1; }
            unzip -p "$jar" fabric.mod.json > /tmp/fmj.json
            jq -e '.id == "funtimeauctionhelper" and .environment == "client"' /tmp/fmj.json > /dev/null
            classes=$(unzip -l "$jar" | grep -c "dev/funtime/auctionhelper" || true)
            if [ "$classes" -lt 40 ]; then
              echo "::error title=jar too small::$v contains only $classes classes"
              exit 1
            fi
            # core must be inside every jar
            unzip -l "$jar" | grep -q "dev/funtime/auctionhelper/HelperCore.class"
            # the version specific entrypoint must be inside as well
            entry=$(jq -r '.entrypoints.client[0] | if type == "object" then .value else . end' /tmp/fmj.json | tr '.' '/')
            unzip -l "$jar" | grep -q "${entry}.class" || { echo "::error title=missing entrypoint::$entry"; exit 1; }
            # bytecode level: Java 8 (52) for 1.16.5, Java 21 (65) for 1.21.x
            expected=65
            [ "$v" = "1.16.5" ] && expected=52
            unzip -p "$jar" "${entry}.class" > /tmp/entry.class
            javap -verbose /tmp/entry.class > /tmp/javap.txt 2>&1 || true
            major=$(grep -m1 "major version" /tmp/javap.txt | awk '{print $3}' || true)
            if [ "$major" != "$expected" ]; then
              echo "::error title=bytecode mismatch::$v entrypoint is major $major, expected $expected"
              exit 1
            fi
            cp "$jar" staged/
            echo "$v: $(stat -c%s "$jar") bytes, $classes classes, bytecode major $major"
            echo "::notice title=FunTimeAuctionHelper-$v.jar::$(stat -c%s "$jar") bytes, $classes classes, bytecode major $major"
          done
          ls -l staged
          mkdir -p FunTimeAuctionHelper-RELEASE
          cp staged/FunTimeAuctionHelper-*.jar FunTimeAuctionHelper-RELEASE/
          ls -l FunTimeAuctionHelper-RELEASE

      - name: 6. Commit the verified JARs into FunTimeAuctionHelper-RELEASE
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/9916b374-winlauncher'
        run: |
          set -euo pipefail
          cp staged/FunTimeAuctionHelper-*.jar FunTimeAuctionHelper-RELEASE/
          git config user.name "FunTime Auction Helper CI"
          git config user.email "ci@users.noreply.github.com"
          git add FunTimeAuctionHelper-RELEASE
          if git diff --cached --quiet; then
            echo "JARs already up to date"
            exit 0
          fi
          git commit -m "chore(release): verified JARs from run ${{ github.run_id }} [release-jars]"
          git push

      - name: Publish full build log (diagnostics, only on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cat /tmp/core.log /tmp/v1165.log /tmp/v1214.log /tmp/v12111.log > /tmp/all.log 2>/dev/null
          if [ ! -s /tmp/all.log ]; then echo "no logs captured"; exit 0; fi
          jq -Rs --arg sha "${{ github.sha }}" '{name:"build-log", head_sha:$sha, status:"completed", conclusion:"neutral", output:{title:"Full build log", summary:"Compile output for the last failing run", text:.}}' /tmp/all.log > /tmp/payload.json
          curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" -d @/tmp/payload.json | head -c 400
          echo

      - name: Upload JARs and test reports
        uses: actions/upload-artifact@v4
        with:
          name: funtime-auction-helper-jars
          path: |
            staged/*.jar
            FunTimeAuctionHelper-RELEASE/*.jar
            FunTimeAuctionHelper/client-common/build/reports/tests/test/**
          if-no-files-found: error

  in-game-selftest:
    name: Real Minecraft client self test (MC ${{ matrix.mc }})
    needs: build-and-test
    # A real Minecraft client is started under Xvfb on the CI runner and the mod writes
    # funtimeauctionhelper-selftest-<version>.json; a missing or failing report fails the job.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.4"
            java: "21"
          - mc: "1.21.11"
            java: "21"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            21
            25

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Install Xvfb and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils jq libopenal1

      - name: Run the mod inside a real Minecraft client
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_GL_VERSION_OVERRIDE: "3.3"
        working-directory: FunTimeAuctionHelper/client-${{ matrix.mc }}
        run: |
          set -o pipefail
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" \
            gradle runClient --no-daemon -PftahSelftest=true > /tmp/runclient.log 2>&1 || true
          report="run/funtimeauctionhelper-selftest-${{ matrix.mc }}.json"
          if [ ! -f "$report" ]; then
            echo "::error title=no self test report::$(grep -E 'Exception|Error|Caused by' /tmp/runclient.log | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g')"
            tail -n 60 /tmp/runclient.log
            exit 1
          fi
          cat "$report"
          jq -e '.status == "PASS"' "$report"
          echo "::notice title=MC ${{ matrix.mc }} in-game self test::$(jq -c '{status, checksPassed, details}' "$report")"

      - name: Upload self test report
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.mc }}
          path: FunTimeAuctionHelper/client-${{ matrix.mc }}/run/funtimeauctionhelper-selftest-*.json
          if-no-files-found: warn
