name: Build Windows
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build (log to file)
        shell: pwsh
        run: |
          npm run tauri build 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinLaucher-Windows
          path: |
            build.log
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/WinLaucher.exe
      - name: Push build log on failure
        if: failure()
        shell: pwsh
        run: |
          git config user.email "ci@winlaucher.local"; git config user.name "ci"
          Select-String -Path build.log -Pattern "error" | Select-Object -First 200 | ForEach-Object {$_.Line} | Out-File -Encoding utf8 build-errors.txt
          git add build-errors.txt; git commit -m "CI build errors [skip ci]"; git push
      - name: Publish exe to repo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release/WinLaucher-Setup.exe" -Force
          Copy-Item "src-tauri/target/release/WinLaucher.exe" "release/WinLaucher.exe" -Force
          git config user.email "ci@winlaucher.local"; git config user.name "ci"
          git add release/WinLaucher-Setup.exe release/WinLaucher.exe
          git commit -m "Release: WinLaucher.exe + Setup [skip ci]"
          git push
