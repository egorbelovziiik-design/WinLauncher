name: Build Windows EXE

# Сборка КП-KingGrief.exe на Windows-раннере.
# PyInstaller не поддерживает кросс-компиляцию, поэтому EXE собирается
# именно под Windows (ubuntu-раннер даст только Linux-бинарник).

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "KP-KingGrief/**"
      - ".github/workflows/build-windows.yml"
  release:
    types: [created]

permissions:
  contents: write

jobs:
  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: KP-KingGrief
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install "discord.py>=2.4,<3" "python-dotenv>=1.0" "APScheduler>=3.10,<4" "tzdata" "pytest>=8" "pytest-asyncio>=0.23"

      - name: Запуск тестов
        run: python -m pytest tests -q

  build-windows:
    name: Сборка КП-KingGrief.exe
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: KP-KingGrief
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Тесты на Windows
        run: python -m pytest tests -q

      - name: Сборка EXE
        run: python build/build_exe.py --clean

      - name: Проверка артефакта
        shell: pwsh
        run: |
          $exe = "dist/КП-KingGrief.exe"
          if (-not (Test-Path $exe)) { throw "EXE не собран: $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "✅ Собран $exe ($size МБ)"
          # EXE обязан запускаться и понятным образом сообщать об отсутствии токена
          $out = & $exe 2>&1 | Out-String
          if ($out -notmatch "DISCORD_TOKEN") {
            throw "EXE не вывел понятную ошибку об отсутствующем токене"
          }
          Write-Host "✅ Проверка запуска без токена пройдена"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: KP-KingGrief-windows
          path: KP-KingGrief/dist/КП-KingGrief.exe
          retention-days: 30

      - name: Публикация в Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: KP-KingGrief/dist/КП-KingGrief.exe
