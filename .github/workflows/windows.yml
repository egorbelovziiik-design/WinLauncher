name: Windows build & tests

on:
  push:
    branches: [main, 'arena/4f921e32-winlauncher']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests
        run: ./scripts/ci-command.ps1 -Command "cargo test --manifest-path src-tauri/Cargo.toml --features native-smoke --lib" -LogName rust-test.log
      - name: Build Windows executable and NSIS installer
        run: ./scripts/ci-command.ps1 -Command "npm run desktop:build -- --target x86_64-pc-windows-msvc" -LogName windows-build.log
      - name: Real Rust backend acceptance checks
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("WinLauncher-native-" + [Guid]::NewGuid().ToString())
          ./scripts/ci-command.ps1 -Command "cargo run --manifest-path src-tauri/Cargo.toml --features native-smoke --bin native-smoke -- `"$root`" release-artifacts" -LogName backend-smoke.log
          $result = $LASTEXITCODE
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $engineLog = Get-ChildItem "$root/data/logs/*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($engineLog) { Copy-Item $engineLog.FullName release-artifacts/backend-engine.log }
          exit $result
      - name: Real NSIS install and uninstall acceptance
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: ./scripts/installer-smoke.ps1
      - name: Native Windows smoke checks (no licensed account)
        id: native-smoke
        continue-on-error: true
        timeout-minutes: 15
        run: node scripts/native-smoke.mjs
      - name: Prepare Windows deliverables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/winlauncher.exe release-artifacts/WinLauncher.exe
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not built' }
          Copy-Item $installer.FullName release-artifacts/WinLauncher-Setup.exe
          Get-FileHash release-artifacts/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release-artifacts/SHA256SUMS.txt
          Copy-Item docs/TESTING.md release-artifacts/TESTING.md
          Copy-Item src-tauri/Cargo.lock release-artifacts/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: WinLauncher-1.0.0-windows-x64
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Rust source and dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-build-metadata
          path: |
            src-tauri/Cargo.lock
            src-tauri/src/
          retention-days: 7

      - name: API-readable build metadata
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Compress-Archive -Path src-tauri/src/* -DestinationPath release-artifacts/rust-formatted-source.zip -Force
          $files = @('src-tauri/Cargo.lock', 'release-artifacts/rust-formatted-source.zip')
          if (Test-Path rust-test.log) { $files += 'rust-test.log' }
          if (Test-Path backend-smoke.log) { $files += 'backend-smoke.log' }
          if (Test-Path release-artifacts/backend-engine.log) { $files += 'release-artifacts/backend-engine.log' }
          if (Test-Path release-artifacts/WinLauncher.exe) { $files += 'release-artifacts/WinLauncher.exe' }
          if (Test-Path release-artifacts/WinLauncher-Setup.exe) { $files += 'release-artifacts/WinLauncher-Setup.exe' }
          if (Test-Path release-artifacts/NATIVE-SMOKE.json) { $files += 'release-artifacts/NATIVE-SMOKE.json' }
          if (Test-Path release-artifacts/NATIVE-SMOKE.md) { $files += 'release-artifacts/NATIVE-SMOKE.md' }
          if (Test-Path release-artifacts/BACKEND-SMOKE.json) { $files += 'release-artifacts/BACKEND-SMOKE.json' }
          if (Test-Path release-artifacts/BACKEND-SMOKE.md) { $files += 'release-artifacts/BACKEND-SMOKE.md' }
          if (Test-Path release-artifacts/INSTALLER-SMOKE.json) { $files += 'release-artifacts/INSTALLER-SMOKE.json' }
          if (Test-Path release-artifacts/INSTALLER-SMOKE.md) { $files += 'release-artifacts/INSTALLER-SMOKE.md' }
          ./scripts/ci-api-delivery.ps1 -Files $files
