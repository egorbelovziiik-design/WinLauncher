name: Probe CI toolchain

on:
  workflow_dispatch:
  push:
    branches: [ 'arena/993b5c08-winlauncher' ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  gradle:
    name: gradle ${{ matrix.gradle }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        gradle: [ '8.10.2', '8.14.3', '9.0.0', '9.1.0', '9.2.0', '9.3.0' ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle --version | head -4

  loom:
    name: loom ${{ matrix.loom }} (project ${{ matrix.project }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - loom: '1.19.3'
            project: nexus12111
          - loom: '1.17.21'
            project: nexus12111
          - loom: '1.14-SNAPSHOT'
            project: nexus12111
          - loom: '1.19.3'
            project: nexus1214
          - loom: '1.10.7'
            project: nexus1214
          - loom: '1.9-SNAPSHOT'
            project: nexus1214
          - loom: '1.6-SNAPSHOT'
            project: nexus1165
          - loom: '1.7-SNAPSHOT'
            project: nexus1165
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - run: gradle tasks -DloomVersion=${{ matrix.loom }} --no-daemon --console=plain
        working-directory: NexusOmegaX/adapters/${{ matrix.project }}
