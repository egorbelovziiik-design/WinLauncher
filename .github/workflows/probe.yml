name: Probe CI toolchain

on:
  workflow_dispatch:
  push:
    branches: [ 'arena/993b5c08-winlauncher' ]
    paths: [ '.github/workflows/probe.yml' ]

jobs:
  loom:
    name: gradle ${{ matrix.gradle }} + loom ${{ matrix.loom }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gradle: '9.8.0', loom: '1.19.3' }
          - { gradle: '9.9.0', loom: '1.19.3' }
          - { gradle: '9.5.0', loom: '1.17.21' }
          - { gradle: '9.6.0', loom: '1.18.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: configure the 1.21.11 project
        run: gradle tasks --no-daemon --console=plain -PloomVersion=${{ matrix.loom }}
        working-directory: NexusOmegaX/adapters/nexus12111

  api1165:
    name: inspect the 1.16.5 yarn API
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: resolve the mapped jar
        continue-on-error: true
        run: gradle compileJava --no-daemon --console=plain
        working-directory: NexusOmegaX/adapters/nexus1165
      - name: javap dump
        run: |
          JAR=$(find ~/.gradle/caches/fabric-loom -name "*.jar" 2>/dev/null | grep -v -e sources | head -1)
          echo "jar=$JAR"
          {
            echo "### 1.16.5 mapped API ($(date -u))"
            echo '```'
            echo "jar=$JAR"
            find ~/.gradle/caches/fabric-loom -maxdepth 4 -name "*.jar" | head -20
            for C in net.minecraft.tag.TagManager net.minecraft.tag.ItemTags net.minecraft.client.util.Window \
                     net.minecraft.client.MinecraftClient net.minecraft.util.math.Box net.minecraft.entity.Entity \
                     net.minecraft.client.option.KeyBinding net.minecraft.client.gui.DrawableHelper; do
              echo "=========== $C"
              javap -classpath "$JAR" -public "$C" 2>&1 | head -70
            done
            echo "=========== Box (all fields)"
            javap -classpath "$JAR" -p net.minecraft.util.math.Box 2>&1 | head -30
            echo "=========== tag package"
            unzip -l "$JAR" | grep -E "net/minecraft/tag/[A-Za-z]+\\.class" | head -30
            echo '```'
          } > /tmp/dump.md
          base64 -w0 /tmp/dump.md > /tmp/dump.b64
          gh api --method PUT "repos/${{ github.repository }}/contents/ci-logs/1165-api.md" \
            -f message="ci: 1.16.5 API dump" \
            -f content="$(cat /tmp/dump.b64)" \
            -f branch="$GITHUB_REF_NAME" || true
