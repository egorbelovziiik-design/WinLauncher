name: Build ReallyWorld KP Discord Bot EXE

on:
  push:
    branches:
      - arena/9647150d-winlauncher
    paths:
      - "ReallyWorldDiscordBot/**"
      - ".github/workflows/build-reallyworld-kp-bot-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ReallyWorldDiscordBot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ReallyWorldDiscordBot/requirements.txt

      - name: Install build & runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Generate Windows .ico from КП beach avatar
        run: |
          python -c "from PIL import Image; img = Image.open('assets/avatar_kp_beach.png').convert('RGBA'); img.save('assets/avatar_kp.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Run Python unit test suite before packaging
        shell: pwsh
        run: |
          $env:PYTHONPATH = "."
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build single-file Multi-Bot DiscordBotHub.exe via PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name DiscordBotHub `
            --icon assets/avatar_kp.ico `
            --paths . `
            --add-data "config.json;." `
            --add-data "assets;assets" `
            --hidden-import aiosqlite `
            --hidden-import sqlite3 `
            --hidden-import dotenv `
            --hidden-import bot.profiles `
            --hidden-import bot.cogs.owner `
            --hidden-import bot.cogs.kp_staff `
            --hidden-import bot.cogs.tickets `
            --hidden-import bot.cogs.moderation `
            --hidden-import bot.cogs.community `
            gui_app.py
          Copy-Item .\dist\DiscordBotHub.exe .\dist\ReallyWorldKPBot.exe -Force

      - name: Smoke-test compiled DiscordBotHub.exe on Windows
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\DiscordBotHub.exe" -ArgumentList "--selftest" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "DiscordBotHub.exe --selftest exited with code $($proc.ExitCode)"
          }
          if (-not (Test-Path ".\selftest-result.txt")) {
            throw "selftest-result.txt was not written by DiscordBotHub.exe!"
          }
          Get-Content .\selftest-result.txt
          if (-not (Select-String -Path .\selftest-result.txt -Pattern "MULTI_BOT=TRUE" -Quiet)) {
            throw "MULTI_BOT=TRUE marker missing!"
          }

      - name: Publish DiscordBotHub.exe to GitHub Releases (rw-kp-bot-latest)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum dist/DiscordBotHub.exe dist/ReallyWorldKPBot.exe > dist/SHA256SUMS.txt
          SUM=$(cat dist/SHA256SUMS.txt)
          gh release delete rw-kp-bot-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create rw-kp-bot-latest \
            dist/DiscordBotHub.exe \
            dist/ReallyWorldKPBot.exe \
            dist/SHA256SUMS.txt \
            --title "Discord Bot Hub (Мульти-Бот Лаунчер + Приглашение ботов — Windows EXE)" \
            --notes "Универсальное Windows x64 приложение (DiscordBotHub.exe) для приглашения и одновременного запуска ЛЮБОГО количества Discord-ботов без установки Python!

          Возможности:
          - Добавляйте сколько угодно профилей ботов (кнопка + Новый бот) и запускайте их одновременно (Запустить ВСЕХ)
          - Автоматическое определение Application ID прямо из вставленного Bot Token + мгновенная генерация ссылок приглашения с выбором прав
          - Индивидуальные модули (Owner, КП + Проверки, Тикеты, Модерация, Верификация/Розыгрыши), свои аватарки, статусы и отдельные базы SQLite для каждого бота
          - По умолчанию первым профилем уже добавлен ваш бот ReallyWorld КП (1563651952506576918, владелец robik0277 / 1381255368650526861)

          SHA-256:
          ${SUM}"
