name: KingGrief 7.12.0 Paper release checks

on:
  push:
    branches: [arena/3eb24343-winlauncher]
    paths:
      - '.github/workflows/kinggrief-paper.yml'
      - 'rw-newyear-assembly/**'
      - 'kinggrief/minecraft-plugin/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template:
    name: Validate the unchanged v7.7 prepared spawn
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check geometry and all model scales
        run: |
          python rw-newyear-assembly/blender-models/build_spawn_v77.py
          python rw-newyear-assembly/blender-models/build_elka_model_v77.py
          git diff --exit-code -- rw-newyear-assembly/core-src/src/main/resources/spawn_v77.dat rw-newyear-assembly/core-src/src/main/resources/elka_v77.csv
          python rw-newyear-assembly/blender-models/test_spawn_v77.py
          python rw-newyear-assembly/blender-models/test_elka_v77.py
      - name: Preserve the exact published v77 template
        shell: bash
        run: |
          set -euo pipefail
          KG="$RUNNER_TEMP/kinggrief-template"
          mkdir -p "$KG"
          echo 'dacec177a987bfd74b80e63faa2e18f446e4577f9d6a071badd382061b705118  rw-newyear-assembly/server/plugins/KingGriefCore/spawn-v77-template.zip' | sha256sum -c -
          test "$(cat rw-newyear-assembly/core-src/src/main/resources/spawn_v77_template.sha256)" = 'dacec177a987bfd74b80e63faa2e18f446e4577f9d6a071badd382061b705118'
          tar -cf "$KG/template.tar" rw-newyear-assembly/server/plugins/KingGriefCore/spawn-v77-template.zip rw-newyear-assembly/core-src/src/main/resources/spawn_v77_template.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: kg-prepared-spawn-v77
          path: ${{ runner.temp }}/kinggrief-template/template.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: template
    name: Paper / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [release, gameplay, economy, protection]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kg-prepared-spawn-v77
          path: ${{ runner.temp }}/prepared
      - run: tar -xf "$RUNNER_TEMP/prepared/template.tar" -C "$GITHUB_WORKSPACE"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare verified Paper 1.21.4 and protocol clients
        shell: bash
        run: |
          set -euo pipefail
          KG="$RUNNER_TEMP/kinggrief-paper"
          mkdir -p "$KG/runtime/cache" "$KG/node"
          curl --fail --location --retry 3 --user-agent 'KingGrief-CI/7.12.0 (https://github.com/egorbelovziiik-design/WinLauncher)' \
            'https://fill-data.papermc.io/v1/objects/5ee4f542f628a14c644410b08c94ea42e772ef4d29fe92973636b6813d4eaffc/paper-1.21.4-232.jar' -o "$KG/paper.jar"
          echo '5ee4f542f628a14c644410b08c94ea42e772ef4d29fe92973636b6813d4eaffc  '"$KG/paper.jar" | sha256sum -c -
          python - "$KG/paper.jar" "$KG" <<'PY'
          import pathlib, sys, zipfile
          from urllib.parse import urlparse
          paper, target = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(paper) as archive:
              sha, url, name = archive.read('META-INF/download-context').decode().strip().split('\t')
          if len(sha) != 64 or urlparse(url).scheme != 'https' or pathlib.Path(name).name != name:
              raise ValueError('Invalid Paper download context')
          (target / 'vanilla-url.txt').write_text(url)
          (target / 'vanilla-sha.txt').write_text(sha)
          (target / 'vanilla-name.txt').write_text(name)
          PY
          curl --fail --location --retry 3 "$(cat "$KG/vanilla-url.txt")" -o "$KG/vanilla.jar"
          echo "$(cat "$KG/vanilla-sha.txt")  $KG/vanilla.jar" | sha256sum -c -
          cp "$KG/vanilla.jar" "$KG/runtime/cache/$(cat "$KG/vanilla-name.txt")"
          (cd "$KG/runtime" && java -Dpaperclip.patchonly=true -jar "$KG/paper.jar")
          API_CP="$(find "$KG/runtime/libraries" "$KG/runtime/versions" -name '*.jar' -type f | sort | paste -sd ':' -)"
          test -n "$API_CP"
          echo "KG_TEST_DIR=$KG" >> "$GITHUB_ENV"
          echo "KG_API_CP=$API_CP" >> "$GITHUB_ENV"
          npm install --prefix "$KG/node" --no-fund --no-audit minecraft-protocol@1.62.0 mineflayer@4.31.0
      - name: Compile Core and KingConnect with Java 21
        run: python rw-newyear-assembly/build-core-hub.py --core-only --include-connect --api-classpath "$KG_API_CP"
      - name: Exercise ${{ matrix.group }} against isolated Paper servers
        run: bash rw-newyear-assembly/run-v712-checks.sh '${{ matrix.group }}'
      - name: Save test summary
        uses: actions/upload-artifact@v4
        with:
          name: kg-report-${{ matrix.group }}
          path: ${{ runner.temp }}/kinggrief-paper/report-${{ matrix.group }}.txt
          if-no-files-found: error
          retention-days: 7
      - name: Save the exact tested distribution
        if: matrix.group == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: kg-verified-distribution
          path: ${{ runner.temp }}/kinggrief-paper/distribution.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish-branch-artifacts:
    name: Save verified artifacts to this branch
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/3eb24343-winlauncher'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: kg-verified-distribution
          path: ${{ runner.temp }}/kg-output
      - uses: actions/download-artifact@v4
        with:
          pattern: kg-report-*
          path: ${{ runner.temp }}/kg-output/reports
          merge-multiple: true
      - name: Verify and save only release artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/kg-output/distribution.tar" -C "$GITHUB_WORKSPACE"
          python rw-newyear-assembly/core-src/src/test/test-distribution-v7120.py
          python - "$RUNNER_TEMP/kg-output/reports" <<'PY'
          import hashlib, os, pathlib, sys
          reports = pathlib.Path(sys.argv[1])
          expected = ['release','gameplay','economy','protection']
          for group in expected:
              if not (reports / ('report-' + group + '.txt')).is_file():
                  raise RuntimeError('Missing test report ' + group)
          core = pathlib.Path('rw-newyear-assembly/KingGriefCore.jar').read_bytes()
          full = pathlib.Path('rw-newyear-assembly/rw-newyear-full-assembly-v7.12.0.zip').read_bytes()
          patch = pathlib.Path('rw-newyear-assembly/KingGriefCore-7.12.0-update.zip').read_bytes()
          text = '# Проверки KingGrief 7.12.0\n\n'
          text += 'Изолированные серверы Paper 1.21.4 build 232, Java 21 и протокольные клиенты; реальные игровые миры не использовались. '
          text += 'Проверки не являются графическим тестом клиента или гарантией защиты от сбоя питания.\n\n'
          text += '- SHA-256 Core: `' + hashlib.sha256(core).hexdigest() + '`\n'
          text += '- SHA-256 полной сборки: `' + hashlib.sha256(full).hexdigest() + '`\n'
          text += '- SHA-256 архива обновления: `' + hashlib.sha256(patch).hexdigest() + '`\n'
          text += '- GitHub Actions: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n\n'
          text += '```\n' + ''.join((reports / ('report-' + group + '.txt')).read_text() for group in expected) + '```\n'
          pathlib.Path('rw-newyear-assembly/ПРОВЕРКИ_7.12.0.md').write_text(text, encoding='utf8')
          PY
          git diff --check
          git add rw-newyear-assembly/server/plugins/KingGriefCore/spawn-v77-template.zip \
            rw-newyear-assembly/core-src/src/main/resources/spawn_v77_template.sha256 \
            kinggrief/public/kinggrief-spawn-v77.zip \
            rw-newyear-assembly/KingGriefCore.jar rw-newyear-assembly/plugins/KingGriefCore.jar \
            rw-newyear-assembly/server/plugins/KingGriefCore.jar kinggrief/public/KingGriefCore.jar \
            kinggrief/public/KingGriefCore-v7.12.0.jar rw-newyear-assembly/KingConnect.jar \
            rw-newyear-assembly/plugins/KingConnect.jar rw-newyear-assembly/server/plugins/KingConnect.jar \
            kinggrief/public/KingConnect.jar kinggrief/public/KingConnect-v2.3.1.jar \
            rw-newyear-assembly/KingGriefCore-7.12.0-update.zip \
            kinggrief/public/KingGriefCore-7.12.0-update.zip rw-newyear-assembly/rw-newyear-full-assembly-v7.12.0.zip \
            kinggrief/public/rw-newyear-full-assembly-v7.12.0.zip rw-newyear-assembly/ОБНОВЛЕНИЕ_7.12.0.md \
            rw-newyear-assembly/server/ОБНОВЛЕНИЕ_7.12.0.md rw-newyear-assembly/ПРОВЕРКИ_7.12.0.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Save tested KingGrief 7.12.0 artifacts [skip ci]'
            git push origin HEAD:refs/heads/arena/3eb24343-winlauncher
          fi
