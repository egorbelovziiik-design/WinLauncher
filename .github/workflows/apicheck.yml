name: API check

on:
  workflow_dispatch:
  push:
    branches: [ 'arena/993b5c08-winlauncher' ]
    paths: [ '.github/workflows/apicheck.yml' ]

jobs:
  dump:
    name: dump ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: nexus1165,  java: 17, gradle: '8.10.2', loom: '1.6-SNAPSHOT',
              classes: 'net.minecraft.util.math.Box net.minecraft.entity.Entity net.minecraft.client.network.ClientPlayerEntity net.minecraft.entity.effect.StatusEffectInstance net.minecraft.block.entity.SignBlockEntity net.minecraft.client.MinecraftClient net.minecraft.client.util.Window net.minecraft.client.option.GameOptions net.minecraft.client.option.KeyBinding net.minecraft.item.Item net.minecraft.entity.player.PlayerInventory net.minecraft.client.network.ClientPlayNetworkHandler net.minecraft.client.gui.DrawableHelper net.minecraft.item.ItemStack net.minecraft.entity.LivingEntity net.minecraft.client.gui.screen.Screen net.minecraft.tag.Tag net.minecraft.tag.TagContainer net.minecraft.client.Mouse net.minecraft.client.Keyboard' }
          - { dir: nexus1214,  java: 21, gradle: '9.5.0', loom: '1.17.21',
              classes: 'net.minecraft.client.Options net.minecraft.client.OptionInstance net.minecraft.client.MouseHandler net.minecraft.client.KeyboardHandler net.minecraft.client.KeyMapping net.minecraft.client.gui.components.ChatComponent net.minecraft.world.level.block.entity.SignBlockEntity net.minecraft.world.level.block.entity.SignText net.minecraft.core.RegistryAccess net.minecraft.core.Registry net.minecraft.core.Holder net.minecraft.core.Holder$Reference net.minecraft.core.registries.BuiltInRegistries net.minecraft.world.item.enchantment.EnchantmentHelper net.minecraft.client.Minecraft net.minecraft.world.inventory.AbstractContainerMenu net.minecraft.world.entity.Entity net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Inventory net.minecraft.world.item.ItemStack net.minecraft.client.multiplayer.ClientPacketListener com.mojang.blaze3d.platform.InputConstants net.minecraft.client.gui.screens.Screen net.minecraft.network.chat.Component' }
          - { dir: nexus12111, java: 21, gradle: '9.5.0', loom: '1.17.21',
              classes: 'net.minecraft.client.Options net.minecraft.client.OptionInstance net.minecraft.client.MouseHandler net.minecraft.client.KeyboardHandler net.minecraft.client.KeyMapping net.minecraft.client.gui.components.ChatComponent net.minecraft.world.level.block.entity.SignBlockEntity net.minecraft.world.level.block.entity.SignText net.minecraft.core.RegistryAccess net.minecraft.core.Registry net.minecraft.core.Holder net.minecraft.core.Holder$Reference net.minecraft.core.registries.BuiltInRegistries net.minecraft.world.item.enchantment.EnchantmentHelper net.minecraft.client.Minecraft net.minecraft.world.inventory.AbstractContainerMenu net.minecraft.world.entity.Entity net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Inventory net.minecraft.world.item.ItemStack net.minecraft.client.multiplayer.ClientPacketListener com.mojang.blaze3d.platform.InputConstants net.minecraft.client.gui.screens.Screen net.minecraft.network.chat.Component' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: resolve the mapped jar
        continue-on-error: true
        run: gradle compileJava --no-daemon --console=plain -PloomVersion=${{ matrix.loom }}
        working-directory: NexusOmegaX/adapters/${{ matrix.dir }}
      - name: javap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec > /tmp/dump.md 2>&1
          set -x
          echo "# ${{ matrix.dir }} API ($(date -u))"
          echo '```'
          echo "gradle home: $GRADLE_USER_HOME"
          ls -d "$HOME/.gradle"/* 2>&1 | head -20
          echo "--- loom dirs"
          find "$HOME" -maxdepth 6 -type d -name "fabric-loom" 2>/dev/null | head -5
          echo "--- jars"
          find "$HOME" -name "*.jar" -path "*minecraft*" 2>/dev/null | head -20
          echo '```'
          JAR=""
          for J in $(find "$HOME" -name "*.jar" -path "*minecraft*" 2>/dev/null | grep -v sources | head -30); do
            echo "== trying $J"
            if jar tf "$J" 2>/dev/null | grep -q "net/minecraft/client/Minecraft"; then JAR="$J"; break; fi
          done
          echo "jar=$JAR"
          echo '```'
          for C in ${{ matrix.classes }}; do
            echo "=========== $C"
            javap -classpath "$JAR" -public "$C" 2>&1 | head -500
          done
          echo '```'

      - name: publish the dump
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ls -la /tmp/dump.md
          if grep -q "^jar=$" /tmp/dump.md 2>/dev/null; then echo "no jar, keeping the old dump"; exit 0; fi
          base64 -w0 /tmp/dump.md > /tmp/dump.b64
          wc -c /tmp/dump.b64
          put() {
            gh api --method PUT "repos/${{ github.repository }}/contents/$1" \
              -f message="ci: API dump ${{ matrix.dir }}" -f content="$(cat /tmp/dump.b64)" \
              -f branch="$GITHUB_REF_NAME" ${2:+-f sha="$2"}
          }
          FILE="ci-logs/api-${{ matrix.dir }}.md"
          SHA=$(gh api "repos/${{ github.repository }}/contents/$FILE?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null)
          echo "sha=$SHA"
          if put "$FILE" "$SHA"; then echo published; else
            echo "retrying as a unique file"
            put "ci-logs/api-${{ matrix.dir }}-${{ github.run_id }}.md"
          fi
