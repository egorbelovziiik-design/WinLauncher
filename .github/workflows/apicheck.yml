name: API check

on:
  workflow_dispatch:
  push:
    branches: [ 'arena/993b5c08-winlauncher' ]
    paths: [ '.github/workflows/apicheck.yml' ]

jobs:
  dump:
    name: dump ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: nexus1165,  java: 17, gradle: '8.10.2', loom: '1.6-SNAPSHOT',
              classes: 'net.minecraft.client.Keyboard net.minecraft.client.Mouse net.minecraft.client.gui.hud.InGameHud net.minecraft.client.render.WorldRenderer net.minecraft.client.gui.screen.ChatScreen net.minecraft.client.MinecraftClient net.minecraft.client.util.math.MatrixStack net.minecraft.client.render.LightmapTextureManager net.minecraft.client.render.GameRenderer net.minecraft.client.render.Camera' }
          - { dir: nexus1214,  java: 21, gradle: '9.5.0', loom: '1.17.21',
              classes: 'net.minecraft.client.input.MouseButtonInfo net.minecraft.client.input.KeyEvent' }
          - { dir: nexus12111, java: 21, gradle: '9.5.0', loom: '1.17.21',
              classes: 'net.minecraft.client.input.MouseButtonInfo net.minecraft.client.input.KeyEvent' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: resolve the mapped jar
        continue-on-error: true
        run: gradle compileJava --no-daemon --console=plain -PloomVersion=${{ matrix.loom }}
        working-directory: NexusOmegaX/adapters/${{ matrix.dir }}
      - name: javap
        continue-on-error: true
        run: |
          exec > /tmp/dump.md 2>&1
          echo "# ${{ matrix.dir }} API ($(date -u))"
          cd NexusOmegaX/adapters/${{ matrix.dir }}
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME  HOME=$HOME"
          JAR=$(gradle -q printMappedJar --no-daemon -PloomVersion=${{ matrix.loom }} 2>/dev/null | grep '^MCJAR=' | head -1 | cut -d= -f2-)
          echo "jar from gradle = $JAR"
          if [ -z "$JAR" ]; then
            echo "--- loom jars on disk"
            find "$HOME" -name "*.jar" -path "*minecraft-merged*" 2>/dev/null | head -20
            for J in $(find "$HOME" -name "*.jar" 2>/dev/null | grep -iv -e sources | grep -i minecraft | head -40); do
              if jar tf "$J" 2>/dev/null | grep -q "net/minecraft/client/Minecraft"; then JAR="$J"; break; fi
            done
            echo "jar from disk = $JAR"
          fi
          echo '```'
          for C in ${{ matrix.classes }}; do
            echo "=========== $C"
            javap -classpath "$JAR" -public "$C" 2>&1 | head -500
          done
          echo '```'

      - name: publish the dump
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          wc -c /tmp/dump.md
          rm -rf /tmp/parts && mkdir -p /tmp/parts
          split -b 45000 -a 2 -d /tmp/dump.md /tmp/parts/chunk-
          ls -la /tmp/parts
          i=0
          for PART in /tmp/parts/chunk-*; do
            base64 -w0 "$PART" > /tmp/part.b64
            FILE="ci-logs/api-${{ matrix.dir }}-${{ github.run_id }}-$i.md"
            SHA=$(gh api "repos/${{ github.repository }}/contents/$FILE?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null)
            gh api --method PUT "repos/${{ github.repository }}/contents/$FILE" \
              -f message="ci: API dump ${{ matrix.dir }} part $i" \
              -f content="$(cat /tmp/part.b64)" \
              -f branch="$GITHUB_REF_NAME" ${SHA:+-f sha="$SHA"} && echo "published $FILE"
            i=$((i+1))
          done
