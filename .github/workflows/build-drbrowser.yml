name: Build DrBrowser

on:
  push:
    paths:
      - 'DrBrowser/**'
      - '.github/workflows/build-drbrowser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drbrowser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 build, tests and single-file publish
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: DrBrowser
        run: dotnet restore DrBrowser.csproj

      - name: Build (Release)
        working-directory: DrBrowser
        run: dotnet build DrBrowser.csproj -c Release --no-restore -warnaserror:false

      - name: Publish single-file win-x64
        working-directory: DrBrowser
        run: >
          dotnet publish DrBrowser.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o dist

      - name: Verify DrBrowser.exe
        shell: pwsh
        run: |
          $exe = "DrBrowser\dist\DrBrowser.exe"
          if (-not (Test-Path $exe)) { throw "DrBrowser.exe не создан" }
          $item = Get-Item $exe
          "{0:N0} bytes" -f $item.Length
          (Get-FileHash $exe -Algorithm SHA256).Hash | Tee-Object -FilePath DrBrowser\dist\DrBrowser.exe.sha256.txt
          if ($item.Length -lt 20000000) { throw "Подозрительно маленький EXE: $($item.Length) bytes" }

      - name: Detect WebView2 Runtime
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application",
            "$env:ProgramFiles\Microsoft\EdgeWebView\Application"
          ) | Where-Object { Test-Path $_ }
          if ($paths) {
            $versions = $paths | ForEach-Object { Get-ChildItem $_ -Directory | Select-Object -ExpandProperty Name }
            "WebView2 Runtime найден: $($versions -join ', ')"
          } else {
            "WebView2 Runtime НЕ найден на раннере — smoke-тест движка будет пропущен."
          }

      - name: Self-test (logic, SQLite, DPAPI, AdBlock, sessions)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:DRBROWSER_SHOTS = "${{ github.workspace }}\DrBrowser\screenshots"
          New-Item -ItemType Directory -Force -Path $env:DRBROWSER_SHOTS | Out-Null
          & "DrBrowser\dist\DrBrowser.exe" --selftest
          $code = $LASTEXITCODE
          "selftest exit code: $code"
          "SELFTEST_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Smoke test (live window + WebView2 + screenshots)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:DRBROWSER_SHOTS = "${{ github.workspace }}\DrBrowser\screenshots"
          & "DrBrowser\dist\DrBrowser.exe" --smoke
          $code = $LASTEXITCODE
          "smoke exit code: $code"
          "SMOKE_EXIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Show test report
        if: always()
        shell: pwsh
        run: |
          $report = "DrBrowser\screenshots\selftest-report.txt"
          if (Test-Path $report) { Get-Content $report } else { "Отчёт не создан (приложение не дошло до тестов)." }
          Get-ChildItem DrBrowser\screenshots -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DrBrowser-win-x64
          path: |
            DrBrowser/dist/DrBrowser.exe
            DrBrowser/dist/DrBrowser.exe.sha256.txt
            DrBrowser/screenshots/**
          if-no-files-found: warn

      - name: Publish EXE, screenshots and report back to the branch
        if: always() && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f DrBrowser/dist/DrBrowser.exe
          git add -f DrBrowser/dist/DrBrowser.exe.sha256.txt || true
          if [ -d DrBrowser/screenshots ]; then git add -f DrBrowser/screenshots || true; fi
          git status --short | head -20
          if git diff --cached --quiet; then echo "no changes to commit"; exit 0; fi
          git commit -m "build: DrBrowser.exe + test report [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish release with the EXE
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f DrBrowser/dist/DrBrowser.exe ]; then echo "no exe"; exit 0; fi
          gh release delete drbrowser-latest --yes --cleanup-tag || true
          gh release create drbrowser-latest \
            --title "DrBrowser 1.0 (win-x64)" \
            --notes "DrBrowser.exe (self-contained, win-x64). Требуется Microsoft Edge WebView2 Runtime: https://go.microsoft.com/fwlink/p/?LinkId=2124703" \
            "DrBrowser/dist/DrBrowser.exe" "DrBrowser/dist/DrBrowser.exe.sha256.txt"
