name: Build hub EXE

on:
  push:
    branches: [arena/95195420-winlauncher, main]
    paths:
      - "StealAnEggUltimate/**"
      - ".github/workflows/build-hub.yml"
  pull_request:
    paths:
      - "StealAnEggUltimate/**"
      - ".github/workflows/build-hub.yml"
  workflow_dispatch:
    inputs:
      commit_binary:
        description: "Commit the published EXE into the branch (dist/) after a green build"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore StealAnEggUltimate/StealAnEggUltimate.csproj

      - name: Build (Release)
        run: >
          dotnet build StealAnEggUltimate/StealAnEggUltimate.csproj
          -c Release --no-restore
          "-flp:logfile=build.log;verbosity=normal"

      - name: Show build errors
        if: failure()
        run: |
          if (-not (Test-Path build.log)) {
            Write-Host "::error::build.log was not produced"
            exit 0
          }
          $lines = Get-Content build.log
          $errors = $lines | Where-Object {
            $_ -match '(error [A-Z]+[0-9]+|error MSB[0-9]+|: error )' -and $_ -notmatch 'csc\.exe|bincore'
          } | Select-Object -Last 20
          if ($errors.Count -eq 0) {
            $errors = $lines | Where-Object { $_ -match 'error' -and $_ -notmatch 'csc\.exe|bincore' } | Select-Object -Last 10
          }
          foreach ($line in $errors) {
            $text = ($line -replace '\s+', ' ')
            if ($text.Length -gt 900) { $text = $text.Substring(0, 900) }
            Write-Host "::error::$text"
          }
          Write-Host "::error::TAIL: $(($lines | Select-Object -Last 3) -join ' | ')"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish single-file EXE
        run: >
          dotnet publish StealAnEggUltimate/StealAnEggUltimate.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o StealAnEggUltimate/dist

      - name: Verify EXE exists
        run: |
          $exe = "StealAnEggUltimate/dist/StealAnEggUltimate.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not produced at $exe" }
          $info = Get-Item $exe
          "EXE: $($info.FullName)"
          "Size: {0:N1} MB" -f ($info.Length / 1MB)
          "SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)"
          Get-ChildItem "StealAnEggUltimate/dist" | Select-Object Name, Length | Format-Table
          Write-Host "::notice::EXE size $([math]::Round($info.Length / 1MB, 1)) MB sha256 $((Get-FileHash $exe -Algorithm SHA256).Hash)"

      - name: Self-test (headless functional tests)
        timeout-minutes: 10
        run: |
          $exe = (Resolve-Path "StealAnEggUltimate/dist/StealAnEggUltimate.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru -Wait
          Write-Host "::notice::self-test exit code $($process.ExitCode)"

          $reportPath = Join-Path $env:APPDATA "StealAnEggUltimate\selftest-report.txt"
          if (Test-Path -LiteralPath $reportPath) {
            $lines = Get-Content -LiteralPath $reportPath
            $lines | ForEach-Object { Write-Host $_ }
            $lines | Where-Object { $_ -match '^\[FAIL\]' } | Select-Object -First 8 |
              ForEach-Object { Write-Host "::error::$_" }
            $lines | Where-Object { $_ -match '^(SUMMARY|RESULT):' } |
              ForEach-Object { Write-Host "::notice::$_" }
          } else {
            Write-Host "::error::self-test report missing at $reportPath"
          }

          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Self-test failed with exit code $($process.ExitCode)"
            exit 1
          }
          exit 0

      - name: Smoke test (start the UI, auto-close)
        timeout-minutes: 5
        run: |
          $exe = (Resolve-Path "StealAnEggUltimate/dist/StealAnEggUltimate.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru
          if (-not $process.WaitForExit(90000)) {
            try { $process.Kill() } catch { }
            Write-Host "::error::Smoke run timed out"
            exit 1
          }
          Write-Host "::notice::smoke exit code $($process.ExitCode)"

          $marker = Join-Path $env:APPDATA "StealAnEggUltimate\smoke-result.txt"
          if (Test-Path -LiteralPath $marker) {
            Get-Content -LiteralPath $marker | ForEach-Object { Write-Host "::notice::$_" }
          } else {
            Write-Host "::error::smoke marker missing"
          }

          $logDir = Join-Path $env:APPDATA "StealAnEggUltimate\logs"
          if (Test-Path -LiteralPath $logDir) {
            $latest = Get-ChildItem -LiteralPath $logDir -Filter *.log | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($latest) {
              Get-Content -LiteralPath $latest.FullName -Tail 40 | ForEach-Object { Write-Host "::notice::LOG $_" }
            }
          }

          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Smoke run failed with exit code $($process.ExitCode)"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $marker)) {
            Write-Host "::error::Smoke marker file was not produced"
            exit 1
          }
          exit 0

      - name: Publish diagnostics to the branch
        if: failure()
        run: |
          git config user.name "hub-build-bot"
          git config user.email "hub-build-bot@users.noreply.github.com"
          $report = Join-Path $env:APPDATA "StealAnEggUltimate\selftest-report.txt"
          $target = "StealAnEggUltimate/selftest-report.txt"
          if (Test-Path $report) { Copy-Item $report $target -Force }
          $logDir = Join-Path $env:APPDATA "StealAnEggUltimate\logs"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter *.log | Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
              ForEach-Object { Copy-Item $_.FullName "StealAnEggUltimate/selftest-app.log" -Force }
          }
          if (Test-Path $target) {
            git add -f $target
            if (Test-Path "StealAnEggUltimate/selftest-app.log") { git add -f "StealAnEggUltimate/selftest-app.log" }
            git commit -m "ci: self-test diagnostics [skip ci]" | Out-Null
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          } else {
            Write-Host "::error::no self-test report to publish"
          }

      - name: Commit published EXE to the branch
        if: (github.event_name == 'workflow_dispatch' && inputs.commit_binary) || contains(github.event.head_commit.message, '[commit-exe]')
        run: |
          git config user.name "hub-build-bot"
          git config user.email "hub-build-bot@users.noreply.github.com"
          git add -f StealAnEggUltimate/dist/StealAnEggUltimate.exe
          git commit -m "build: publish StealAnEggUltimate.exe [skip ci]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealAnEggUltimate-win-x64
          path: |
            StealAnEggUltimate/dist/StealAnEggUltimate.exe
            StealAnEggUltimate/dist/RobloxStudio/**
            StealAnEggUltimate/dist/Config/**
            StealAnEggUltimate/dist/Docs/**
          if-no-files-found: error
          retention-days: 30
