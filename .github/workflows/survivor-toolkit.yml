name: Survivor Toolkit (Fabric 1.21.11)

on:
  push:
    branches: [arena/2bba5611-winlauncher]
    paths:
      - 'survivor-toolkit/**'
      - '.github/workflows/survivor-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

# An unresponsive runner for one commit must not block a newer commit. Outdated
# jobs cannot overwrite a newer branch: their push would be non-fast-forward.
concurrency:
  group: survivor-toolkit-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALSOFT_DRIVERS: 'null' # virtual audio device; real sound output is not tested in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run unit tests
        id: build
        continue-on-error: true
        working-directory: survivor-toolkit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build 2>&1 | tee build-output.log
      - name: Launch Minecraft client smoke test
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: survivor-toolkit
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          timeout 300s xvfb-run -a ./gradlew --no-daemon -Psmoke runClient 2>&1 | tee smoke-output.log
          grep -q '^PASS:' run/survivor-smoke-result.txt
      - name: Run client game test in an isolated singleplayer world
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: survivor-toolkit
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s xvfb-run -a ./gradlew --no-daemon runClientGameTest 2>&1 | tee gametest-output.log
          grep -q 'SURVIVOR_TOOLKIT_GAME_TEST_PASS' gametest-output.log
      - name: Smoke-test the remapped installable JAR
        id: production
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: survivor-toolkit
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s ./gradlew --no-daemon runProductionSmoke 2>&1 | tee production-output.log
          grep -q '^PASS:' build/run/productionSmoke/survivor-smoke-result.txt
      - name: Publish concise diagnostics as a GitHub check
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'survivor-toolkit/';
            const read = p => fs.existsSync(dir + p) ? fs.readFileSync(dir + p, 'utf8') : '(no output)';
            const compact = p => read(p).split('\n')
              .filter(line => !line.includes('World loading finished:'))
              .map(line => line.length > 2400 ? line.slice(0, 2400) + ' …[truncated]' : line)
              .join('\n');
            const build = '${{ steps.build.outcome }}';
            const smoke = '${{ steps.smoke.outcome }}';
            const gametest = '${{ steps.gametest.outcome }}';
            const production = '${{ steps.production.outcome }}';
            const testDir = dir + 'build/test-results/test';
            const suites = fs.existsSync(testDir) ? fs.readdirSync(testDir).filter(p => p.endsWith('.xml')) : [];
            const totals = {tests: 0, failures: 0, errors: 0, skipped: 0};
            for (const file of suites) {
              const tag = fs.readFileSync(testDir + '/' + file, 'utf8').match(/<testsuite\b[^>]*>/)?.[0] || '';
              for (const key of Object.keys(totals)) {
                const value = tag.match(new RegExp('\\b' + key + '="(\\d+)"'));
                if (value) totals[key] += Number(value[1]);
              }
            }
            const text = [
              `Build: ${build}`, `JUnit: ${suites.length ? JSON.stringify(totals) : 'no results'}`,
              `Client smoke: ${smoke}`, `Game test: ${gametest}`, `Production JAR smoke: ${production}`,
              '', '--- build output (tail) ---', read('build-output.log').slice(-14000),
              '', '--- smoke output (tail) ---', compact('smoke-output.log').slice(-10000),
              '', '--- smoke result ---', read('run/survivor-smoke-result.txt'),
              '', '--- game test output (tail) ---', compact('gametest-output.log').slice(-18000),
              '', '--- production output (tail) ---', compact('production-output.log').slice(-14000),
              '', '--- production smoke result ---', read('build/run/productionSmoke/survivor-smoke-result.txt')
            ].join('\n');
            await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo,
              name: 'Survivor Toolkit diagnostics', head_sha: context.sha, status: 'completed',
              conclusion: build === 'success' && smoke === 'success' && gametest === 'success' && production === 'success' ? 'success' : 'failure',
              output: {title: 'Build, development and production client tests', summary: text.slice(-64000)}});
      - name: Save installable JAR to this branch
        if: steps.build.outcome == 'success' && steps.smoke.outcome == 'success' && steps.gametest.outcome == 'success' && steps.production.outcome == 'success'
        shell: bash
        run: |
          mkdir -p survivor-toolkit/release
          cp survivor-toolkit/build/libs/survivor-toolkit-1.0.0.jar survivor-toolkit/release/survivor-toolkit-1.0.0.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f survivor-toolkit/release/survivor-toolkit-1.0.0.jar
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish Survivor Toolkit jar [skip ci]'
            git push origin HEAD:refs/heads/${{ github.ref_name }}
          fi
      - name: Fail if a check failed
        if: always() && (steps.build.outcome != 'success' || steps.smoke.outcome != 'success' || steps.gametest.outcome != 'success' || steps.production.outcome != 'success')
        run: exit 1
