name: Mixin target dump

on:
  workflow_dispatch:
  push:
    branches: [ 'arena/993b5c08-winlauncher' ]
    paths: [ '.github/workflows/mixindump.yml' ]

jobs:
  dump:
    name: targets ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: nexus1165
            java: 17
            gradle: '8.10.2'
            loom: '1.6-SNAPSHOT'
            classes: 'net.minecraft.client.Keyboard net.minecraft.client.Mouse net.minecraft.client.gui.hud.InGameHud net.minecraft.client.render.WorldRenderer net.minecraft.client.gui.screen.ChatScreen net.minecraft.client.MinecraftClient'
          - dir: nexus1214
            java: 21
            gradle: '9.5.0'
            loom: '1.17.21'
            classes: 'net.minecraft.client.KeyboardHandler net.minecraft.client.MouseHandler net.minecraft.client.gui.Gui net.minecraft.client.renderer.LevelRenderer net.minecraft.client.gui.screens.ChatScreen net.minecraft.client.Minecraft'
          - dir: nexus12111
            java: 21
            gradle: '9.5.0'
            loom: '1.17.21'
            classes: 'net.minecraft.client.KeyboardHandler net.minecraft.client.MouseHandler net.minecraft.client.gui.Gui net.minecraft.client.renderer.LevelRenderer net.minecraft.client.gui.screens.ChatScreen net.minecraft.client.Minecraft'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: resolve the mapped jar
        continue-on-error: true
        run: gradle compileJava --no-daemon --console=plain -PloomVersion=${{ matrix.loom }}
        working-directory: NexusOmegaX/adapters/${{ matrix.dir }}
      - name: javap
        continue-on-error: true
        run: |
          exec > /tmp/dump.md 2>&1
          JAR=$(cd NexusOmegaX/adapters/${{ matrix.dir }} && gradle -q printMappedJar --no-daemon -PloomVersion=${{ matrix.loom }} 2>/dev/null | grep '^MCJAR=' | head -1 | cut -d= -f2-)
          echo "jar=$JAR"
          for C in ${{ matrix.classes }}; do
            echo "=========== $C"
            javap -classpath "$JAR" -p "$C" 2>&1 | grep -E "^  (public|protected|private|static|final|abstract)|^public |^=====" | grep -vE "^  (public|private|protected|static|final) [a-z]" | head -200
          done

      - name: publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          rm -rf /tmp/parts && mkdir -p /tmp/parts
          split -b 45000 -a 2 -d /tmp/dump.md /tmp/parts/chunk-
          i=0
          for PART in /tmp/parts/chunk-*; do
            base64 -w0 "$PART" > /tmp/part.b64
            FILE="ci-logs/mixintargets-${{ matrix.dir }}-${{ github.run_id }}-$i.md"
            gh api --method PUT "repos/${{ github.repository }}/contents/$FILE" \
              -f message="ci: mixin target dump ${{ matrix.dir }} $i" \
              -f content="$(cat /tmp/part.b64)" \
              -f branch="$GITHUB_REF_NAME" >/dev/null && echo "published $FILE"
            i=$((i+1))
          done
