name: Build MADorigg.exe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/36dcf8a5-winlauncher
    paths:
      - "MADorigg/**"
      - ".github/workflows/madorigg-exe.yml"
    tags:
      - "madorigg-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MADorigg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MADorigg/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.10.0

      - name: Generate icon
        run: python tools/make_icon.py

      - name: Build one-file executable
        run: python tools/build_exe.py

      - name: Smoke-test the frozen exe (headless, silent, fast)
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $launchArgs = @("--windowed", "--no-audio", "--no-volume", "--time-scale", "40", "--log-level", "INFO")
          $proc = Start-Process -FilePath ".\dist\MADorigg.exe" -ArgumentList $launchArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Smoke test failed: exit $($proc.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MADorigg-windows
          path: MADorigg/dist/MADorigg.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to release (latest build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: madorigg-latest
          name: MADorigg — Windows build (latest)
          body: |
            Автосборка **MADorigg.exe** (Windows 10/11, one-file, без консоли).

            Запуск: двойной клик, либо `MADorigg.exe --no-volume` / `--windowed`.
            Выход в любой момент: `Esc` или `Alt+F4` — громкость восстанавливается.
          files: MADorigg/dist/MADorigg.exe
          fail_on_unmatched_files: true

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/madorigg-v')
        uses: softprops/action-gh-release@v2
        with:
          files: MADorigg/dist/MADorigg.exe
