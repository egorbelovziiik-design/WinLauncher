# ==============================================================================
# Альтернативный манифест: Pelican Panel (современный форк Pterodactyl) + Wings
# Предоставляется как готовая справочная конфигурация на случай использования
# сторонней панели вместе с подготовленным нами Linux/DDR5/NVMe окружением.
# ==============================================================================
services:
  database:
    image: mariadb:11.4
    container_name: pelican-mariadb
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - pelican_db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ChangeMeRootStrongPass!}
      MYSQL_DATABASE: panel
      MYSQL_USER: pelican
      MYSQL_PASSWORD: ${DB_PASSWORD:-ChangeMePelicanPass!}

  cache:
    image: redis:7.4-alpine
    container_name: pelican-redis
    restart: unless-stopped

  panel:
    image: ghcr.io/pelican-dev/panel:latest
    container_name: pelican-panel
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - database
      - cache
    volumes:
      - pelican_var:/pelican-data
      - pelican_logs:/var/www/html/storage/logs
      - pelican_caddy:/etc/caddy
    environment:
      APP_URL: "https://${PANEL_DOMAIN:-panel.example.com}"
      APP_TIMEZONE: "Europe/Kyiv"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: "panel"
      DB_USERNAME: "pelican"
      DB_PASSWORD: "${DB_PASSWORD:-ChangeMePelicanPass!}"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"

  wings:
    image: ghcr.io/pelican-dev/wings:latest
    container_name: pelican-wings
    restart: unless-stopped
    networks:
      - default
    ports:
      - "8080:8080"
      - "2022:2022"
    tty: true
    environment:
      TZ: "Europe/Kyiv"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pelican
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /etc/pelican:/etc/pelican
      - /var/lib/pelican:/var/lib/pelican
      - /var/log/pelican:/var/log/pelican
      - /tmp/pelican:/tmp/pelican

volumes:
  pelican_db:
  pelican_var:
  pelican_logs:
  pelican_caddy:
