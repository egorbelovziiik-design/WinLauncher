plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.3'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The whole common core is compiled into every version specific jar.
sourceSets {
    main {
        java {
            srcDir '../client-common/src/main/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

remapJar {
    archiveFileName = "FunTimeAuctionHelper-1.16.5.jar"
}

// In-game self test: `gradle runClient -PftahSelftest=true`
// Minecraft 1.16.5 must run on a Java 8 runtime, so the run task uses a Java 8 launcher
// while the build itself runs on the newer JDK required by Loom.
tasks.matching { it.name == 'runClient' }.configureEach {
    if (project.hasProperty('ftahSelftest')) {
        jvmArgs "-Dfuntimeauctionhelper.selftest=" + project.property('ftahSelftest')
    }
    try {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(8)
        }
    } catch (Exception ignored) {
        // fall back to the build JVM when no Java 8 toolchain is available
    }
}
