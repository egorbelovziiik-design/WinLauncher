plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.3'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// The whole common core is compiled into every version specific jar.
sourceSets {
    main {
        java {
            srcDir '../client-common/src/main/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 8
}

java {
    sourceCompatibility = JavaVersion.toVersion("8")
    targetCompatibility = JavaVersion.toVersion("8")
}

remapJar {
    archiveFileName = "FunTimeAuctionHelper-1.16.5.jar"
}

// In-game self test: `gradle runClient -PftahSelftest=true`
// NOTE: Loom 1.19 development launches (devlaunchinjector) need a Java 9+ runtime, so the
// 1.16.5 client self test is not executed by CI. The 1.16.5 JAR is verified by compiling
// against the real 1.16.5 official mappings, by bytecode level and by entrypoint inspection.
tasks.matching { it.name == 'runClient' }.configureEach {
    if (project.hasProperty('ftahSelftest')) {
        jvmArgs "-Dfuntimeauctionhelper.selftest=" + project.property('ftahSelftest')
    }
}
