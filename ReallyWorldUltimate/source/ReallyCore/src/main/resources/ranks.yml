    weight: 10
    display-name: "Игрок"
    prefix: "<gray>[ИГРОК]</gray> "
    tab-prefix: "<gray>ИГРОК</gray> "
    color: "<gray>"
    price-rilliks: 0
    max-homes: 2
    auction-slots: 3
    kill-coin-multiplier: 1.0
    monthly-grant-quota: 0
    inherits: []
    permissions:
      - "reallycore.player.*"

