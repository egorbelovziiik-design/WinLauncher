# =======================================================================
# ranks.yml — Система привилегий ReallyWorld Ultimate
# Каждая следующая привилегия наследует права предыдущей по полю inherits,
# за исключением персональных китов (/kit <rank>).
# Донатеры НЕ имеют административных прав бана/кика/OP/WorldEdit!
# =======================================================================

default-rank: "PLAYER"

ranks:
