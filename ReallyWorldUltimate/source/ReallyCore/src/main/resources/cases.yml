# =======================================================================
# cases.yml — 8 Кейсов ReallyWorld Ultimate
# Сумма шансов (weight) каждого кейса нормируется и проверяется при старте.
# Ключ списывается АТОМАРНО в БД ДО выдачи награды — защита от двойного дропа.
# =======================================================================

animation:
  enabled: true
  spin-ticks: 48
  step-interval-ticks: 4

