settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: false
  deprecated-verbose: default
  shutdown-message: "§6§lRW §8» §eСервер перезагружается, возвращайтесь через минуту!"
  minimum-api: none
  use-map-color-cache: true
spawn-limits:
  monsters: 50
  animals: 8
  water-animals: 4
  water-ambient: 6
  water-underground-creature: 4
  axolotls: 3
  ambient: 2
chunk-gc:
  period-in-ticks: 400
ticks-per:
  animal-spawns: 400
  monster-spawns: 4
  water-spawns: 400
  water-ambient-spawns: 400
  water-underground-creature-spawns: 400
  axolotl-spawns: 400
  ambient-spawns: 400
  autosave: 6000
aliases: now-in-commands.yml
