# =======================================================================
# spheres.yml — Система Сфер ReallyWorld Ultimate (15 уникальных сфер)
# Сферы работают в ЛЕВОЙ РУКЕ (OFF_HAND), идентифицируются по подписанному
# PersistentDataContainer (reallycore:item_id + reallycore:signature),
# а НЕ по названию предмета.
# Объединение двух одинаковых сфер в наковальне повышает уровень:
# NORMAL (I) -> EPIC (II, x1.35) -> LEGEND (III, x1.7) -> MYTHIC (IV, x2.0)
# =======================================================================

anvil-upgrade:
  enabled: true
  experience-cost-levels: 15
  tiers:
    NORMAL: { display: "Обычная [I]", multiplier: 1.0, color: "<#55FF55>" }
    EPIC: { display: "Эпическая [II]", multiplier: 1.35, color: "<#AA00AA>" }
    LEGEND: { display: "Легендарная [III]", multiplier: 1.7, color: "<#FBBC00>" }
    MYTHIC: { display: "Мифическая [IV]", multiplier: 2.0, color: "<#FF4500>" }

