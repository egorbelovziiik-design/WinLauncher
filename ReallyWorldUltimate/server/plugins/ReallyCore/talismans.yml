# =======================================================================
# talismans.yml — Система Талисманов ReallyWorld Ultimate (12 талисманов)
# Талисман работает в ЛЕВОЙ РУКЕ ИЛИ в специальном слоте Талисмана (/profile).
# ЖЁСТКОЕ ОГРАНИЧЕНИЕ АНТИ-СТАКИНГА: одновременно активен СТРОГО 1 талисман!
# Если и в левой руке, и в слоте профиля есть талисман — учитывается только
# предмет в левой руке, без неконтролируемого суммирования эффектов.
# =======================================================================

settings:
  max-active-talismans: 1
  allow-profile-talisman-slot: true
  # Если талисман в левой руке спасает от смертельного удара как Тотем Бессмертия:
  act-as-totem-in-offhand: true
  keep-talisman-on-totem-pop: false

