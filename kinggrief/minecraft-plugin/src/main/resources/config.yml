# Конфигурация плагина KingGriefBridge v1.3.0 (предварительно настроена для https://kinggrief.vercel.app)
# Просто положите KingGriefBridge.jar в папку /plugins на сервере kinggrief.pickme.cloud и перезапустите сервер.

base-url: "https://kinggrief.vercel.app"

# Секрет моста (совпадает с MINECRAFT_BRIDGE_SECRET на Vercel):
secret: "53b473e51739892e63fc8c1e5243a00266a20d2f34c3d7b4"

# Идентификатор сервера в админ-панели:
server-id: "kinggrief-main"

# Интервал опроса облачной очереди выдачи в секундах (минимум 3):
poll-seconds: 5

# Принудительный шаблон команды выдачи кейсов (оставьте пустым "" для 100% автоопределения плагина кейсов):
# Примеры: "dc givekey {player} {case} {amount}" или "cases give {player} {case} {amount}"
case-command-override: ""

# Уведомлять игрока в чате при получении кейсов/привилегий с сайта:
notify-player: true

# Разрешить любые команды из админ-панели/магазина без проверки префикса (по умолчанию false):
allow-all-commands: false

# Белый список разрешённых консольных команд (без ведущего слэша /):
allowed-prefixes:
  - "dc "
  - "donatecase "
  - "jdonatecase "
  - "cases "
  - "case "
  - "crates "
  - "crate "
  - "cc "
  - "ucase "
  - "universalcase "
  - "mooncases "
  - "mcases "
  - "rwcases "
  - "treexcases "
  - "excellentcrates "
  - "crazycrates "
  - "acubelets "
  - "lp "
  - "luckperms "
  - "pex "
  - "relics "
  - "riliks "
  - "p "
  - "points "
  - "playerpoints "
  - "eco "
  - "money "
  - "kit "
  - "kits "
  - "give "
  - "unban "
  - "pardon "
  - "unmute "
