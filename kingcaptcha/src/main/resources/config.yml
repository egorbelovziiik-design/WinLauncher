# KingCaptcha 1.0.0 — отдельный плагин для хаба Paper 1.21.4.
# Проверка производится при КАЖДОМ входе, в том числе при SSO/автовходе KingHub.
# Значения применяются к новым проверкам после /captcha reload или перезапуска.
rounds: 3                # шагов с разными предметами; 1–5
max-mistakes: 3          # число ошибок до отключения; 1–10
timeout-seconds: 90      # общее время на все шаги; 10–300
retry-cooldown-seconds: 15 # задержка повторного входа после ошибок/таймаута; 0–600
bossbar: true            # полоска со временем и названием задания
# Ошибки и задержка хранятся только в памяти, по UUID, до перезапуска.
# Чтобы случайно не исключить обычных игроков, IP-адреса не блокируются.
