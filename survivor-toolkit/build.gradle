plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        survivor_toolkit {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    if (project.hasProperty('smoke')) {
        runs.client.vmArg '-Dsurvivortoolkit.smoke=true'
    }
}

// Game tests are a separate, client-only test mod and are not shipped in the JAR.
// They create an integrated world; no Minecraft server EULA is accepted here.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'survivor_toolkit_gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}
loom.runs.clientGameTest.vmArg '-Dfabric.client.gametest.modid=survivor_toolkit_gametest'

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

test { useJUnitPlatform() }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from('LICENSE') { rename { 'LICENSE_survivor-toolkit' } } }
