/*
 * NEXUS CLIENT OMEGA X - Minecraft 1.16.5 adapter
 *
 * Build:   gradle build -p adapters/nexus1165      (or run build.bat in the project root)
 * Output:  build/libs/NexusOmegaX-1.16.5.jar
 *
 * 1.16.5 uses the yarn names (MinecraftClient, ClientPlayerEntity, MatrixStack,
 * GameOptions...) and Java 8 bytecode. The only dependencies are Minecraft, the
 * yarn mappings and fabric-loader.
 */
buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loomVersion}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

group = 'nexus'
version = modVersion

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
}

sourceSets {
    main {
        java {
            srcDirs = ['src', '../../api/src', '../../core/src', '../../modules/src']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-nowarn'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "NexusOmegaX-${minecraftVersion}.jar"
    manifest {
        attributes(
            'Implementation-Title': 'Nexus Client Omega X',
            'Implementation-Version': project.version,
            'Minecraft-Version': "${minecraftVersion}"
        )
    }
}

remapJar {
    archiveFileName = "NexusOmegaX-${minecraftVersion}.jar"
}

tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allSource
    archiveFileName = "NexusOmegaX-${minecraftVersion}-sources.jar"
}

// Diagnostic helper: prints the absolute path of the mapped Minecraft jar that
// this adapter compiles against (used by the CI API dump, harmless otherwise).
tasks.register('printMappedJar') {
    doLast {
        configurations.compileClasspath.resolve().each { f ->
            if (f.name.contains('minecraft')) {
                println 'MCJAR=' + f.absolutePath
            }
        }
    }
}
