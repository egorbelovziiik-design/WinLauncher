/*
 * NEXUS CLIENT OMEGA X - Minecraft 1.21.4 adapter
 *
 * Build:   gradle build -p adapters/nexus1214      (or run build.bat in the project root)
 * Output:  build/libs/NexusOmegaX-1.21.4.jar
 *
 * The adapter is compiled together with the shared NexusCore sources
 * (../../api/src, ../../core/src, ../../modules/src). The only dependencies are
 * Minecraft, the official Mojang mappings and fabric-loader - no Fabric API, so
 * a wrong API version can never break the build.
 */
buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loomVersion}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'

group = 'nexus'
version = modVersion

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
}

sourceSets {
    main {
        java {
            srcDirs = ['src', '../../api/src', '../../core/src', '../../modules/src']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-nowarn'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveFileName = "NexusOmegaX-${minecraftVersion}.jar"
    manifest {
        attributes(
            'Implementation-Title': 'Nexus Client Omega X',
            'Implementation-Version': project.version,
            'Minecraft-Version': "${minecraftVersion}"
        )
    }
}

remapJar {
    archiveFileName = "NexusOmegaX-${minecraftVersion}.jar"
}

tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allSource
    archiveFileName = "NexusOmegaX-${minecraftVersion}-sources.jar"
}

// Diagnostic helper: prints the absolute path of the mapped Minecraft jar that
// this adapter compiles against (used by the CI API dump, harmless otherwise).
tasks.register('printMappedJar') {
    doLast {
        configurations.compileClasspath.resolve().each { f ->
            if (f.name.contains('minecraft')) {
                println 'MCJAR=' + f.absolutePath
            }
        }
    }
}
