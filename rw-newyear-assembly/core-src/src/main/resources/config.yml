# KINGGRIEF CORE v6.7.1 — EVENT SEARCH, BUY ORDERS AND RECOVERABLE TRADES
server-ip: "kinggrief.pickme.cloud"
enable-builtin-auth: true
enable-builtin-tab-and-scoreboard: true
push-resourcepack-on-join: true
resourcepack-url: "https://kinggrief.vercel.app/kinggrief-mega-rp-v66.zip"
resourcepack-sha1: "63461884bd573de19a043f11b5982a34536e47d9"
starting-coins: 5000.0
starting-relics: 50

# Защита поиска мировых ивентов. Изменения применяются после полного перезапуска.
events:
  auto-enabled: true             # false: отключить только автоматический запуск
  allow-chunk-generation: true  # false: использовать лишь уже загруженные чанки
  search-radius-blocks: 2500    # радиус поиска от спавна или центра смещённой границы (256–10000)
  min-free-heap-mb: 256         # запас JVM heap перед запросом новых чанков; не лимит RAM контейнера

# Охота в существующей PvP-яме. Игроков не телепортирует и инвентарь не меняет.
crown-event:
  auto-enabled: true
  interval-seconds: 1800
  lobby-seconds: 45
  match-seconds: 300
  goal-seconds: 90
