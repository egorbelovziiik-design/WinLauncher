name: KingGriefCore
main: net.kinggrief.core.KingGriefCore
version: 3.0.0
api-version: '1.16'
author: KingGrief
website: https://kinggrief.vercel.app
softdepend: [LuckPerms, PlayerPoints, Vault, AuthMe, TAB, DecentHolograms, FancyNpcs, KingGriefBridge]
description: Полное ядро Новогодней Сборки KINGGRIEF (Копия ReallyWorld v3.0 — 3D Спавн, 16 NPC, 11 Кейсов, Регистрация, ТАБ, Скорборд, Кланы, Аукцион, Сферы, Трапки, 40 Привилегий).
commands:
  menu:
    description: Главное меню новогоднего сервера KINGGRIEF
    aliases: [help, m, servermenu]
  reg:
    description: Регистрация аккаунта на сервере
    aliases: [register]
  login:
    description: Авторизация на сервере
    aliases: [l]
  changepassword:
    description: Сменить пароль аккаунта
    aliases: [changepass, cp]
  logout:
    description: Выйти из сессии аккаунта
  spawn:
    description: Телепортация на Новогодний Спавн
  setspawn:
    description: Установить точку спавна
  spawnbuild:
    description: Построить или обновить 3D Новогодний Спавн, NPC и Голограммы
    aliases: [setupserver, kgsetup]
  rtp:
    description: Рандомная телепортация в мир выживания
    aliases: [wild]
  donate:
    description: Каталог привилегий, кейсов и цен с сайта
    aliases: [privs, prices]
  kp:
    description: Команда Проекта (КП) и ДКП
    aliases: [dkp, staff]
  media:
    description: Медиа-партнёрка (YouTube, TikTok, Twitch, MEDIA+)
    aliases: [yt, tiktok, twitch]
  shop:
    description: Донат-магазин за рилики (Сферы, Талисманы, Трапки, Пласты)
    aliases: [donateshop]
  nyshop:
    description: Новогодняя лавка Деда Мороза
    aliases: [santa]
  gifts:
    description: Подарки Снегурочки и ежедневные награды
    aliases: [free, daily]
  promo:
    description: Активировать промокод (NEWYEAR, KINGGRIEF, FREE)
    aliases: [promocode]
  cases:
    description: Меню всех 11 кейсов и выдача ключей
    aliases: [kgcase]
  kits:
    description: Меню всех 29 наборов привилегий
  kit:
    description: Получить набор привилегии
  buyer:
    description: Скупщик ресурсов ReallyWorld
    aliases: [sellgui]
  jobs:
    description: Работы сервера (Шахтёр, Лесоруб, Охотник, Фермер)
    aliases: [job]
  ah:
    description: Аукцион игроков
    aliases: [auc, auction]
  clan:
    description: Система кланов сервера
    aliases: [clans, c]
  cc:
    description: Клановый чат
  bp:
    description: Зимний Боевой Пропуск с наградами
    aliases: [pass, battlepass]
  mine:
    description: Телепорт к Зимней Авто-Шахте на спавне
    aliases: [automine]
  airdrop:
