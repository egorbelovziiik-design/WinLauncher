  v:
    description: Режим невидимости для КП и ДКП
    aliases: [vanish]
  tp:
    description: Телепортация к игроку (КП/ДКП)
  tphere:
    description: Телепортировать игрока к себе (ДКП/КП)
  invsee:
    description: Посмотреть инвентарь игрока
  mute:
    description: Выдать мут игроку
  unmute:
    description: Снять мут с игрока
  kick:
    description: Кикнуть игрока с сервера
  tempban:
    description: Временно забанить игрока
  ban:
    description: Забанить игрока
  unban:
    description: Разбанить игрока
    aliases: [pardon]
  bc:
    description: Объявление на весь сервер
    aliases: [broadcast]
  setrank:
    description: Выдать привилегию игроку (OP / Консоль)
