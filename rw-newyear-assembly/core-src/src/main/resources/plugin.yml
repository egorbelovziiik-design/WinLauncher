    aliases: [repair]
  ext:
    description: Потушить себя от огня
  ci:
    description: Очистить свой инвентарь
    aliases: [clearinventory]
  hat:
    description: Надеть блок в руке на голову
  near:
    description: Найти игроков поблизости
  gm:
    description: Сменить игровой режим (0, 1, 2, 3)
