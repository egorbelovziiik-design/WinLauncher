    aliases: [event, mystic]
  rg:
    description: Управление приватами (блоками руды)
    aliases: [ps, region]
  sb:
    description: Включить или выключить правую панель (Скорборд)
    aliases: [scoreboard]
  sethome:
    description: Установить точку дома
  home:
    description: Телепортироваться домой
  delhome:
    description: Удалить точку дома
