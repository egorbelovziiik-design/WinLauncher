# KINGGRIEF CORE v7.1.0 — DISPLAY NPC, EXPEDITIONS AND ASYNC RTP
server-ip: "kinggrief.pickme.cloud"
enable-builtin-auth: true
enable-builtin-tab-and-scoreboard: true
# Paper отправляет ресурспак через server.properties; повторный запрос ядра отключён.
push-resourcepack-on-join: false
resourcepack-url: "https://kinggrief.vercel.app/kinggrief-mega-rp-v72.zip"
resourcepack-sha1: "1729e4f29ad7fded64ab2f23c8b27f783936cd3d"
starting-coins: 5000.0
starting-relics: 50

# Защита поиска мировых ивентов. Изменения применяются после полного перезапуска.
events:
  auto-enabled: true             # false: отключить только автоматический запуск
  allow-chunk-generation: true  # false: использовать лишь уже загруженные чанки
  search-radius-blocks: 2500    # радиус поиска от спавна или центра смещённой границы (256–10000)
  min-free-heap-mb: 256         # запас JVM heap перед запросом новых чанков; не лимит RAM контейнера

# Охота за короной в существующей PvP-яме; телепортация и смена инвентаря не выполняются.
crown-event:
  auto-enabled: true
  interval-seconds: 1800
  lobby-seconds: 45
  match-seconds: 300
  goal-seconds: 90

# Безопасный асинхронный поиск /rtp. Одновременно не более двух поисков.
rtp:
  allow-chunk-generation: true  # false: уже созданные чанки можно загружать с диска, новые не генерируются
  min-free-heap-mb: 256         # порог JVM heap перед генерацией; не предел памяти контейнера
