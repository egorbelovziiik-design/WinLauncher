name: KingAC
prefix: KingАЧ
version: 8.3.0
main: net.kinggrief.kingac.KingAcPlugin
api-version: '1.16'
softdepend: [KingGriefCore, LuckPerms]
author: KINGGRIEF
description: "KingАЧ v8.1 — Профессиональный Нейро-Античит (12 Схем Инжекта, жёсткий блок урона сквозь стены по голосованию 11 лучей, вертикальный Aim-детект Голова-Вниз-Вверх, Точный 3D Raycast Хитбокса — блок ударов в воздух / HitBox / SilentAura / Backtrack, 13-лучевой RayTrace, Микро-дёргания GCD, TriggerBot, Timer, Blink, GuiMove, Phase, AntiKB, Scaffold, FastPlace, X-Ray, Живой Монитор-HUD и Авто-Бан 24/7). Совместим с ядрами Spigot/Paper 1.16.5 — 1.21.x"

commands:
  kingac:
    aliases: [ac, kac, kas, ach, kingach, anticheat, kingantisoft, antisoft]
    description: Панель управления античитом KingАЧ v8.0 (детекты, схемы инжекта, монитор, настройки)
  kinject:
    aliases: [inject, inj, kacinject, kacscheme, schemes]
    description: 8 Схем Инжекта KingАЧ (GUI выбора цели и схемы / запуск на игроке)
  report:
    aliases: [rep, cheater]
    description: Подать жалобу на читера в KingАЧ (/report <ник> [причина])
    permission: kingac.report
  reports:
    aliases: [replist]
    description: Открыть список жалоб игроков в KingАЧ

permissions:
  kingac.report:
    description: Позволяет отправлять жалобы /report на подозрительных игроков
    default: true
  kingac.staff:
    description: Доступ к уведомлениям KingАЧ, /ac, /inject, /reports и живому монитору
    default: op
  kingac.admin:
    description: Полное управление античитом KingАЧ, модулями схем инжекта и разбан (/ac unban)
    default: op
