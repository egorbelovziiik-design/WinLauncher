# =====================================================================
# 🌐 KingConnect v1.0.0 — УНИВЕРСАЛЬНАЯ СВЯЗКА СЕРВЕРОВ В ОДНОМ ПЛАГИНЕ
# Работает СРАЗУ в 2 режимах:
#   1) БЕЗ ПРОКСИ (1.20.5 - 1.21.11): официальные пакеты Player#transfer +
#      крипто-токен Cookie HMAC-SHA256 (вход без повторного /login!).
#   2) ЧЕРЕЗ ПРОКСИ (Velocity / BungeeCord): канал BungeeCord Connect + Forward.
# =====================================================================

# Уникальный ID этого сервера (должен совпадать с ключом в секции servers ниже!)
# Например: hub, grief1, grief2, anarchy, duels
this-server-id: "grief1"
this-server-name: "&#80D8FF&l❄ ГРИФ #1"

# Режим переноса игроков:
#   auto     — УМНЫЙ 2-в-1: если включён Velocity/Bungee (или не указан IP), переводит через Прокси;
#              иначе переводит НАПРЯМУЮ по IP:Port пакетом Minecraft 1.20.5-1.21+ с Cookie SSO!
#   transfer — Строго прямой перенос по IP:Port без прокси-сервера (1.20.5 - 1.21+)
#   proxy    — Строго через прокси Velocity / BungeeCord (по имени proxy-name)
mode: "auto"

# Единый секретный ключ связки (ОДИНАКОВЫЙ на всех ваших серверах!).
# Защищает авто-вход без повторного /login (HMAC-SHA256) и облачную синхронизацию.
secret-key: "KingGrief-Network-Secret-2026"

# ID главного сервера Хаба / Лобби для команды /hub (/lobby)
hub-server: "hub"

# Защита от прямого входа в обход Хаба (включайте true на Грифе, когда поднимете сервер hub):
# Если true — на этот сервер пустит только игроков, перешедших из связки с подписанным токеном!
require-sso-from-hub: false

# Блокировка побега с сервера через /hub или /servers во время ПвП (сек.)
combat-block-seconds: 30

# =====================================================================
# 🏰 РЕЖИМ ХАБА / ЛОББИ (включите true на сервере Лобби или командой /kcon hubmode)
# =====================================================================
hub-mode:
  enabled: false
  # Выдавать компас «Выбор Сервера» в 5-й слот хотбара при входе в Хаб
  give-selector-compass: true
  compass-slot: 4
  # Двойной прыжок и батуты из слизи в Хабе
  double-jump: true
  # Защита мира Хаба от ломания блоков, голода, урона и падения в бездну
  protect-world: true
  # Встроенная регистрация /register и /login в Хабе (если там не стоит KingGriefCore)
  standalone-auth: true
  spawn:
    world: "world"
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 180.0
    pitch: 0.0

# =====================================================================
# ☁ ОБЛАЧНАЯ ШИНА СИНХРОНИЗАЦИИ (РАБОТАЕТ БЕЗ MYSQL И БЕЗ ДОП. ПОРТОВ!)
# Синхронизирует живой онлайн, привилегии, авто-баны KingАЧ, /gsc, /galert и /send
# =====================================================================
cloud-sync:
  enabled: true
  url: "https://kinggrief.vercel.app/api/minecraft/network"
  interval-seconds: 4
  sync-ranks: true
  sync-bans: true
  # Публичный адрес этого сервера (необязательно — можно указать прямо в секции servers)
  public-host: ""
  public-port: 25565

# Интервал прямого пинга серверов по протоколу Minecraft (сек.)
ping-interval-seconds: 5

# =====================================================================
