plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.3'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java {
            srcDir '../client-common/src/main/java'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    include(fabricApi.module("fabric-api-base", project.fabric_api_version))
    include(fabricApi.module("fabric-lifecycle-events-v1", project.fabric_api_version))
    include(fabricApi.module("fabric-key-binding-api-v1", project.fabric_api_version))
    include(fabricApi.module("fabric-rendering-v1", project.fabric_api_version))
}

processResources {
    inputs.property "version", project.version
    from('../assets/branding/icon-128.png') {
        rename { 'assets/axsesclient/icon.png' }
    }
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

remapJar {
    archiveFileName = "AXSESCLIENT-1.21.11.jar"
}

tasks.matching { it.name == "runClient" }.configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

if (project.hasProperty('axsesSelftest')) {
    loom {
        runs {
            client {
                vmArg "-Daxsesclient.selftest=true"
            }
        }
    }
}
